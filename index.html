kselip yükselmediğine, simetrik olup olmadığına, uvulanın bir yöne kaymış olup olmadığına bakınız.\n5. Dil basacağını ya da kağıttan yaptığınız bir külahı hastanın orofarenksinin arka duvarının sağına hafifçe değdiriniz. Bu sırada palatal arkların hareketini ve öğürme olup olmadığını gözleyiniz.\n6. Orofarenks solunda 5. basamağı tekrarlayınız.\n7. Hastaya ağzını açtırıp dilin ağız içinde duruşuna, dilde atrofi ve kayma var olup olmadığına bakınız.\n8. Hastadan dili ile kendi sağ yanağını dışarı doğru itmesini isteyiniz ve bu sırada dile yanak üzerinden direnç uygulayınız. Kuvvetsizlik var mı? Not ediniz.\n9. 8. maddeyi solda da uygulayınız.\n10. Hastadan dilini dışarı çıkarmasını isteyiniz. Dilin bir tarafa kaymış olup olmadığına bakınız.\n11. Hasta karşıya bakarken başın duruşunu muayene ediniz.\n12. Sağ avucunuzu hastanın sol yanağına koyarak hastadan yüzünü sola çevirmesini isteyiniz.\n13. Bunu yapabiliyorsa yüze direnç uygulayınız ve hastanın elinize uyguladığı kuvveti değerlendiriniz.\n14. Sol elinizle de sağ sternokleidomastoid kasını palpe ediniz.\n15. 12-14. basamakları ellerinizi değiştirerek diğer tarafta da yapınız.\n16. Hasta karşıya bakarken omuzların duruşunu muayene ediniz.\n17. Hastadan omuzlarını yukarı kaldırmasını isteyiniz\n18. Bunu yapabiliyorsa, avuçlarınızı aynı anda omuzlara koyunuz ve ters yönde kuvvet uygulayarak omuzlarını aşağı indirmeye çalışınız (bu sırada hastadan tüm gücüyle omuzlarını yukarı kaldırmaya çalışmasını isteyiniz)\n19. Kuvvetsizlik var mı? Değerlendiriniz.\n\n**KAS TONUSU MUAYENESİ BECERİ BASAMAKLARI**\n1. Hastayı muayene masasına oturtunuz veya yatırınız\n2. Hastadan kendini gevşek bırakmasını, hareket etmemesini isteyiniz\n3. Sol elinizle hastanın sağ el bileğini kavrayınız\n4. Sağ elinizle, hastanın sağ eline pasif fleksiyon ve ekstansiyon hareketlerini eklemin tüm açıklığı boyunca ardı sıra yaptırınız\n5. Bu sırada hissettiğiniz pasif dirence dikkat ediniz\n6. Hastanın ön koluna pasif fleksiyon ve ekstansiyon hareketlerini, eklemin tüm açıklığı boyunca ardı sıra yaptırınız. \n7. Bu sırada hissettiğiniz pasif dirence dikkat ediniz\n8. 3-7 nolu beceri basamaklarını hastanın sol üst ekstremitesinde tekrar ediniz\n9. Hastayı yatırınız\n10. Sol elinizle hastanın sağ ayak bileğini kavrayınız\n11. Sağ elinizle hastanın sağ ayak bileğine pasif fleksiyon ve ekstansiyon hareketlerini eklemin tüm... *(Cümle kaynak metinde burada kesilmektedir)*\n\n**KAS KUVVETİ MUAYENESİ BECERİ BASAMAKLARI**\n*El parmakları ve el bileğinde kas kuvveti muayenesi*\n1. Hastayı muayene masasına oturtunuz\n2. Hastadan beş parmağını bir araya getirmesini isteyiniz. \n3. Bu hareketi yapabiliyorsa size direnmesini söyleyerek baş ve işaret parmaklarınızla hastanın parmaklarını ayırmaya çalışınız \n4. Kas gücünü MRC skalasına göre değerlendiriniz\n5. 2-4 nolu beceri basamaklarını diğer elde tekrarlayınız\n6. Hastadan ellerini avuçları yere bakar durumda ileri uzatmasını ve parmaklarını olabildiğince açmasını isteyiniz\n7. Baş parmağınızı hastanın işaret parmağının, işaret parmağınızı hastanın küçük parmağının lateral yüzüne koyunuz\n8. Hastadan parmaklarını açık tutmasını ve size karşı koymasını isteyiniz\n9. Kas gücünü MRC skalasına göre değerlendiriniz\n10. 6-9 nolu beceri basamaklarını diğer elde tekrarlayınız\n11. Hastadan bir elini, parmakları bitişik olacak ve avuç içi yere bakacak şekilde öne doğru uzatmasını söyleyiniz\n12. Sağ elinizle hastanın elini, el bileğinin distalinden kavrayınız\n13. Hastadan el parmaklarını yukarı doğru kaldırmasını isteyiniz\n14. Bunu yapabiliyorsa ters yönde kuvvet uygulayarak size karşı koymasını söyleyiniz\n15. Kas gücünü MRC skalasına göre değerlendiriniz\n16. 11-15 nolu beceri basamaklarını diğer elde tekrarlayınız\n17. Hastadan avucunu yukarı çevirmesini ve elini yumruk yapmasını isteyiniz\n18. Bir elinizle hastanın el bileğini, proksimalinden kavrayınız\n19. Hastadan el bileğini yukarı bükmesini isteyiniz\n20. Bunu yapabiliyorsa ters yönde kuvvet uygulayarak size karşı koymasını isteyiniz\n21. Kas gücünü MRC sklalasına göre değerlendiriniz\n22. 17-21 nolu basamakları basamaklarını diğer el bileğinde tekrarlayınız\n23. Hastadan avuç içi aşağı bakacak şekilde bir elini yumruk yapmasını isteyiniz\n24. Hastadan el bileğini yukarı bükmesini isteyiniz\n25. Bunu yapabiliyorsa ters yönde kuvvet uygulayarak size karşı koymasını isteyiniz\n26. Kas gücünü MRC sklalasına göre değerlendiriniz\n27. 23-26 nolu beceri basamaklarını diğer el bileğinde tekrarlayınız\n\n*Dirsek ve omuzda kas kuvveti muayenesi*\n1. Hastayı muayene masasına oturtunuz\n2. Hastadan kolunu dirsekten kendine doğru bükmesini isteyiniz\n3. Bunu yapabiliyorsa sol elinizi hastanın koluna koyunuz, sağ elinizle ters yönde kuvvet uygulayarak size karşı direnmesini isteyiniz\n4. Kas gücünü MRC skalasına göre değerlendiriniz\n5. 2-4 nolu beceri basamaklarını diğer kolda tekrarlayınız\n6. Hastadan bir kolunu dirsekten bükmesini isteyiniz\n7. Hastanın bileğinden tutunuz \n8. Kolunu açmasını söyleyiniz ve ters yönde kuvvet uygularken size karşı koymasını isteyiniz\n9. Kas gücünü MRC skalasına göre değerlendiriniz\n10. 6-9 nolu beceri basamakları diğer kolda tekrarlayınız\n11. Hastadan kollarını yana doğru açmasını isteyiniz\n12. Bunu yapabiliyorsa ellerinizi hastanın kollarının lateral kısmına koyunuz\n13. Siz ters yönde kuvvet uygularken size karşı direnmesini isteyiniz\n14. Her bir kol için kas gücünü MRC skalasına göre değerlendiriniz\n15. Hastadan kollarını yana doğru açmasını isteyiniz\n16. Ellerinizi hastanın kollarının mediyal kısmına koyunuz\n17. Siz ters yönde kuvvet uygularken kollarını kapatmasını isteyiniz\n18. Her bir kol için kas gücünü MRC sklasına değerlendiriniz\n\n*Ayak parmakları ve ayak bileğinde kas kuvveti muayenesi*\n1. Hastayı muayene masasına yatırınız\n2. Hastadan bir ayak baş parmağını yukarıya doğru bükmesini (dorsofleksiyon) isteyiniz\n3. Bunu yapabiliyorsa sağ el parmaklarınızı, hastanın baş parmağının üstüne koyunuz\n4. Siz ters yönde kuvvet uygularken size karşı koymasını isteyiniz\n5. Kas kuvvetini MRC skalasına göre değerlendiriniz\n6. 2-5 nolu beceri basamaklarını diğer ayakta tekrarlayınız\n7. Hastadan bir ayak baş parmağını aşağıya doğru bükmesini (plantar fleksiyon) isteyiniz\n8. Bunu yapabiliyorsa sağ el parmaklarınızı hastanın baş parmağının altına koyunuz\n9. Siz ters yönde kuvvet uygularken size karşı koymasını isteyiniz\n10. Kas gücünü MRC skalasına göre değerlendiriniz\n11. 7-10 nolu beceri basamaklarını diğer ayakta tekrarlayınız\n12. Hastadan bir ayağını yukarı doğru bükmesini (dorsofleksiyon) isteyiniz\n13. Bunu yapabiliyorsa, sağ elinizi, ayağının sırtına koyunuz\n14. Siz ters yönde kuvvet uygularken size karşı koymasını isteyiniz\n15. Kas gücünü MRC skalasına göre değerlendiriniz\n16. 12-15 nolu beceri basamaklarını diğer ayakta tekrarlayınız\n17. Hastadan bir ayağını aşağı doğru bükmesini (plantar fleksiyon) isteyiniz\n18. Bunu yapabiliyorsa sağ elinizi hastanın ayak tabanına yerleştiriniz \n19. Siz ters yönde kuvvet uygularken size karşı koymasını isteyiniz\n20. Kas gücünü MRC skalasına göre değerlendiriniz\n21. 17-20 nolu beceri basamaklarını diğer ayakta tekrarlayınız\n\n*Diz ve kalçada kas kuvveti muayenesi*\n1. Hastayı muayene masasına yatırınız\n2. Hastadan dizini bükmesini isteyiniz\n3. Bunu yapabiliyorsa, elinizle bacağın arka kısmından kavrayınız\n4. Siz ters yönde kuvvet uygularken (bacağını açmaya çalışırken) size karşı koymasını isteyiniz\n5. Kas gücünü MRC skalasına göre değerlendiriniz\n6. 2-5 nolu beceri basamaklarını diğer bacakta tekrarlayınız\n7. Hastadan dizini bükmesini ve dizi bükülü halde iken bacağını yukarı doğru kaldırmasını isteyiniz\n8. Bunu yapabiliyorsa, sol elinizi popliteal fossaya, sağ elinizi tibiyanın üstüne koyunuz\n9. Siz ters yönde kuvvet uygularken (bacağını kapamaya çalışırken) size karşı koymasını isteyiniz\n10. Kas gücünü MRC skalasına göre değerlendiriniz\n11. 6-10 nolu beceri basamaklarını diğer bacakta tekrarlayınız\n12. Hastadan uyluğunu (yatıyorsa ayağı yere değmeyecek şekilde) yukarı kaldırmasını isteyiniz \n13. Bunu yapabiliyorsa sağ elinizi hastanın uyluğu üzerine yerleştiriniz\n14. Siz ters yönde kuvvet uygularken size karşı koymasını isteyiniz\n15. Kas gücünü MRC skalasına göre değerlendiriniz\n16. 12-15 nolu beceri basamaklarını diğer bacakta tekrarlayınız\n17. Sağ elinizi hastanın bir uyluğunun arka kısmına yerleştiriniz\n18. Hastadan bacağını kalçadan arkaya doğru hareket ettirmesini isteyiniz\n19. Siz ters yönde kuvvet uygularken size karşı koymasını isteyiniz\n20. Kas gücünü MRC skalasına göre değerlendiriniz\n21. 17-20 nolu beceri basamaklarını diğer bacakta tekrarlayınız\n22. Hastadan bacaklarını aralamasını isteyiniz\n23. Bunu yapabiliyorsa ellerinizi, dizlerinin lateral kısmına koyunuz\n24. Siz ters yönde kuvvet uygularken size karşı koymasını isteyiniz\n25. Her bir bacak için kas gücünü MRC skalasına göre değerlendiriniz\n26. Hastadan bacaklarını hafifçe aralamasını isteyiniz\n27. Ellerinizi, dizlerinin mediyal kısmına koyunuz\n28. Hastadan bacaklarını kapatmasını ve size karşı koymasını isteyiniz\n29. Her bir bacak için kas gücünü MRC skalasına göre değerlendiriniz\n\n**DERİN TENDON REFLEKSLERİ MUAYENESİ BECERİ BASAMAKLARI**\n*Üst ekstremiteler*\n1. Hastayı muayene masasına oturtunuz\n2. Hastanın giysisinin kollarını dirsek üstüne dek sıvayınız\n3. Hastadan kollarını gevşek bırakmasını isteyiniz\n4. Hastanın sağ tarafına geçiniz \n\n*Biseps refleksi*\n5. Hastanın sağ kolunu kucağına serbestçe bırakmasını isteyiniz.\n6. Antekübital fossa üzerinde biseps kasının tendonunu bulunuz\n7. Sol el baş parmağınızı, hastanın sağ biseps tendonu üstüne, tendona dik olarak bastırınız\n8. Sağ elinizdeki refleks çekiciyle parmağınızın üzerine vurunuz\n9. Dirsekte fleksiyon olup olmadığını ve refleksin şiddetini değerlendiriniz\n10. Refleksi alamıyorsanız hastaya kolunu tamamen serbest bırakmasını hatırlatarak muayeneyi tekrarlayınız.\n11. Hastanın sol tarafına geçip 5-10 nolu beceri basamaklarını solda tekrarlayınız\n12. Sağ ve sol taraftaki refleks şiddetlerini birbirleriyle karşılaştırınız\n\n*Triseps refleksi*\n5. Hastanın sağ kolunu sol elinizle antekübital fossadan kavrayarak kolu 90 derece abdüksiyona... *(Cümle kaynak metinde burada kesilmektedir)*\n\n*(Radyal stiloid refleksine ait olduğu anlaşılan devam maddeleri)*\n5. Hastanın sağ kolunu kucağına serbestçe bırakmasını isteyiniz.\n6. Radyal stiloid çıkıntının 3-4 cm proksimaline sağ elinizdeki refleks çekici ile vurunuz.\n7. Ön kolda fleksiyon ve supinasyon olup olmadığını ve refleksin şiddetini değerlendiriniz\n8. Refleksi alamıyorsanız hastaya kolunu tamamen serbest bırakmasını hatırlatarak muayeneyi tekrarlayınız.\n9. Hastanın sol tarafına geçip 5-8 nolu beceri basamaklarını solda tekrarlayınız\n10. Sağ ve sol taraftaki refleks şiddetlerini birbirleriyle karşılaştırınız \n\n*Alt ekstremiteler*\n1. Hastayı, ayakları yere değmeyecek ve dizler boşlukta kalacak şekilde, muayene masasına oturtunuz\n2. Hastanın giysisinin paçalarını diz üstüne dek sıvayınız\n3. Hastadan bacaklarını gevşek bırakmasını isteyiniz\n4. Hastanın sağ tarafına geçiniz \n\n*Patella refleksi*\n5. Sol elinizi kuadriseps kasının üzerine koyunuz.\n6. Patella alt kenarı ile tüberositaz tibia arasında kuadriseps tendonunu palpe ediniz. \n7. Tendon üzerine sağ elinizdeki çekiçle vurunuz.\n8. Bacakta ekstansiyon olup olmadığını ve refleksin şiddetini değerlendiriniz\n9. Refleksi alamıyorsanız hastadan sağ ve sol ellerini birbirlerine kenetlemesini ve her iki elin parmak uçlarıyla diğer eli çekerek ayırmaya zorlamasını isteyiniz. \n10. Bu sırada muayeneyi tekrarlayınız.\n11. Hastanın sol tarafına geçip 5-10 nolu beceri basamaklarını solda tekrarlayınız\n12. Sağ ve sol taraftaki refleks şiddetlerini birbirleriyle karşılaştırınız\n\n*Aşil refleksi*\n5. Hasta muayene masasında otururken eğer çıkarmamışsa, hastadan ayakkabılarını çıkarmasını isteyiniz\n6. Sol elinizle hastanın sağ ayağını tabandan destekleyerek ayağı hafifçe dorsifleksiyona getiriniz\n7. Sağ eldeki refleks çekicinin geniş tarafıyla hastanın sağ aşil tendonuna vurunuz.\n8. Ayak bileğinde plantar fleksiyon olup olmadığını ve refleksin şiddetini değerlendiriniz\n9. Hastanın sol tarafına geçip 5-8 nolu beceri basamaklarını solda tekrarlayınız\n10. Sağ ve sol taraftaki refleks şiddetlerini birbirleriyle karşılaştırınız\n11. Üst ve alt ekstremitelerdeki reflekslerin şiddetlerini birbirleriyle karşılaştırınız\n\n**YÜZEYEL REFLEKSLERİN MUAYENESİ BECERİ BASAMAKLARI**\n*Taban derisi refleksi*\n1. Hastanın ayakkabı ve çoraplarını çıkarttırınız \n2. Hastayı muayene masasına sırt üstü yatırınız.\n3. Hastanın sağ tarafına geçiniz   \n4. Hastaya ayak tabanını çizeceğinizi, ayağını çekmemesini söyleyiniz.\n5. Sol elinizle hastanın sağ ayak bileğinden sıkıca tutup ayağı sabitleyiniz\n6. Ayak tabanını, sağ elinizdeki künt objeyle (refleks çekici sapının sivri ucu gibi), topuktan ve ayak dış kenarının 1 cm kadar medialinden başlayarak öne doğru, ön taban kabartısına (metatarsal kabartı) ulaştıktan sonra da mediale doğru, baş parmak hizasına kadar orta şiddette bastırarak çiziniz.\n7. Bu sırada ayak parmaklarının hareketini gözleyiniz (plantar fleksiyon olup olmadığını değerlendiriniz)\n8. 4-7 nolu beceri basamaklarını solda tekrarlayınız\n\n**PATOLOJİK REFLEKSLERİN MUAYENESİ BECERİ BASAMAKLARI**\n*Babinski refleksi (Taban derisi cevabı muayenesi ile aynı)*\nTaban derisi refleksi muayenesi yapar gibi yapınız (Taban derisi refleksine bakarken, ayak baş parmağında dorsofleksiyon, ayak parmaklarında yelpaze gibi açılma hareketi gelişirse “Babinski işareti var” denir)."},
  {id:"boyun-muayene",title:"Boyun Muayenesi Becerisi",cat:"muayene",content:"1. Ellerinizi yıkayınız.\n2. Hastayı muayene hakkında bilgilendiriniz, onamını alınız ve rahat olmasını sağlayınız.\n3. Lenf bezleri muayenesi için hastadan soyunmasını isteyiniz. (Bu uygulama için giysiler; boyun çene altından, köprücük kemiğine (clavicula) kadar rahatça görüntülenecek şekilde gevşetilir.).\n4. Hastayı aydınlık ortamda oturtunuz.\n5. İleriye doğru bakar pozisyonda olmasını sağlayınız.\n6. Boynun gergin tutulmamasına dikkat ediniz.\n7. Hastanın tam karşısına geçiniz.\n8. Hastanın anatomik noktalarının belirlenmesi (suprasternal çentik, klavikula, sternokleidomastoid kas), supraklaviküler bölge incelemesi için omuz başlarının yukarıya doğru kaldırılmasının istenmesi.\n9. Boyunda inspeksiyon ile kitle olup, olmadığını değerlendiriniz.\n10. İşaret, orta ve yüzük parmaklarınızı yan yana getiriniz.\n11. Parmaklarınızın uçlarını hafifçe bastırarak, aşağıda sıralanan lenf bezi bölgelerinde lenf bezi palpasyonu yapınız.\n    *   Preaurikular bölge lenf bezleri\n    *   Parotit bölge lef bezleri\n    *   Submental bölge lenf bezleri\n    *   Sublingual bölge lenf bezleri\n    *   Submandibular bölge lenf bezleri\n    *   Oksipital bölge lenf bezleri\n    *   Postaurikular (Mastoit) bölge lenf bezleri\n    *   Anteriyör servikal zincir lenf bezleri\n    *   Derin servikal zincir lenf bezleri\n    *   Posteriyör servikal süperfisiyal zincir lenf bezleri\n    *   Posteriyör servikal spinal zincir lenf bezleri\n    *   Supraklavikular bölge lenf bezleri\n12. Lenf bezleri var ise, ağrılı olup olmadıklarını, çevreye fikse olup olmadıklarını, boyutlarını, kıvamlarını değerlendiriniz, bulundukları bölgedeki cilt renginde değişiklik var mı bakınız ve tüm bulgularınızı not ediniz.\n13. Servikal zincirlerde yer alıyor ise, üst, orta ve alt olarak düşey yerleşimini de değerlendiriniz.\n\n**TİROİD MUAYENESİ**\n**İNSPEKSİYON**\n14. Hastanın boyun bölgesini üstte laringeal (tiroid) kıkırdaktan, altta sternum ve klavikulalara kadar, boyun orta hattı ve iki yanına bakarak, inceleyiniz, bir asimetri var mı değerlendiriniz.\n15. Hastanın başını 30 derece ekstansiyona getirmesini sağlayınız.\n16. Hastadan yutkunmasını isteyiniz.\n17. Yutkunma sırasında sternum ve klavikulaların üst kısmını dikkatle gözleyiniz.\n\n**PALPASYON (önden)**\n18. Hastanın tam karşısında durarak yüz yüze geliniz. Önden palpasyonda her iki elinizin başparmağını kullanınız.\n19. Hastanın boynunu hafif fleksiyona getirip çenesini hafifce sağa çeviriniz ve sternokleidomastoid kasın gevşemesini sağlayınız.\n20. Krikoid kıkırdağın hemen altında, trakeanın önünde yer alan tiroid istmusunu palpe ediniz (tiroid büyük ve hastanın boynu ince ve uzunsa palpe edilebilir).\n21. Sağ eliniz ile larinksi sağa doğru itiniz. Hastanın yutkunmasını isteyip sağ tiroid lobunu sol el baş parmağınız önde olacak şekilde palpe ediniz.\n22. Sol eliniz ile larinksi sola doğru itiniz. Hastanın yutkunmasını isteyip sol tiroid lobunu sağ el baş parmağınız önde olacak şekilde palpe ediniz.\n23. Hem sağ hem de solda yutkunma ile sternum ve klavikulaların arkasından yükselen bir kitlenin parmaklarınıza dokunup dokunmadığını değerlendiriniz.\n\n**PALPASYON (arkadan)**\n24. Hastanın arkasına geçiniz ve her iki elinizi hastanın boynuna koyunuz. Arkadan palpasyon için her iki elinizin 2,3 ve 4.parmaklarının pulpasını kullanınız.\n25. Sağ elinizle trakeayı sola itiniz ve anterolateralinde, sol el parmaklarınızın pulpalarıyla sol tiroid lobunu palpe ediniz. Hastadan yutkunmasını isteyerek palpasyonu tekrarlayınız.\n26. Sol elinizle trakeayı sağa itiniz ve anterolateralinde, sağ el parmaklarınızın pulpalarıyla sağ tiroid lobunu palpe ediniz. Hastadan yutkunmasını isteyerek palpasyonu tekrarlayınız.\n27. Yutkunma ile sternum ve klavikulaların arkasından yükselen bir kitlenin parmaklarınıza dokunup dokunmadığını değerlendiriniz.\n28. Hem önden, hem de arkadan yaptığınız tiroid palpasyonuyla her iki tiroid lobunun büyüklüğünü, kıvamını, yüzey yapısını değerlendiriniz.\n29. Bez içinde farklılık gösteren bir alan (nodül) bulunup, bulunmadığını araştırınız.\n30. Var ise nodüllerin yerini, büyüklüğünü, kıvamını, yüzey yapısını değerlendiriniz.\n31. Tiroid loblarının hemen lateralinde, paratrakeal lenf nodlarının varlığını palpasyonla araştırınız.\n\n**PERKÜSYON (Retrosternal uzanım gösteren bir guatr şüphesi mevcut ise yapılır)**\n32. Sol elinizin orta parmağını hastanın üst sternum ve manubrium üzerine koyunuz, diğer parmakları cilde değmeyecek şekilde tutunuz.\n33. Sağ elinizin ikinci ve üçüncü parmağı ile sol el orta parmağın birinci ve ikinci boğumları arasına denk gelecek şekilde bileğinizi serbest bırakarak vurunuz. (Normalde bu bölgede ses rezonans olarak duyulur Mat duyulur ise retrosternal guatr düşünülür).\n\n**OSKÜLTASYON**\n34. Hastanın karşısına geçiniz ve steteskopun çan kısmını önce sağ, sonra sol tiroid lobu üzerine koyarak oskülte ediniz. Tiroid üzerinde üfürüm varsa kaydediniz.\n35. Tiroid kartilajın laterali ile sternokleidomastoid kas arasında karotis arter nabzını palpe ederek hissediniz.\n36. Sağ taraf karotis arter trasesini boyun tabanından çeneye kadar dinleyiniz.\n37. Sol taraf karotis arter trasesini boyun tabanından çeneye kadar dinleyiniz.\n38. Sağ ve sol subklaviyan arter trasesini oskülte ediniz.\n39. Hastaya muayenenin bittiğini, giyinebileceğini söyleyiniz.\n40. Elinizi yıkayınız ve hastaya bulgularınız ile ilgili bilgi veriniz."},

linde, sağ el parmaklarınızın pulpalarıyla sağ tiroid lobunu palpe ediniz. Hastadan yutkunmasını isteyerek palpasyonu tekrarlayınız.\n27. Yutkunma ile sternum ve klavikulaların arkasından yükselen bir kitlenin parmaklarınıza dokunup dokunmadığını değerlendiriniz.\n28. Hem önden, hem de arkadan yaptığınız tiroid palpasyonuyla her iki tiroid lobunun büyüklüğünü, kıvamını, yüzey yapısını değerlendiriniz.\n29. Bez içinde farklılık gösteren bir alan (nodül) bulunup, bulunmadığını araştırınız.\n30. Var ise nodüllerin yerini, büyüklüğünü, kıvamını, yüzey yapısını değerlendiriniz.\n31. Tiroid loblarının hemen lateralinde, paratrakeal lenf nodlarının varlığını palpasyonla araştırınız.\n\n**PERKÜSYON (Retrosternal uzanım gösteren bir guatr şüphesi mevcut ise yapılır)**\n32. Sol elinizin orta parmağını hastanın üst sternum ve manubrium üzerine koyunuz, diğer parmakları cilde değmeyecek şekilde tutunuz.\n33. Sağ elinizin ikinci ve üçüncü parmağı ile sol el orta parmağın birinci ve ikinci boğumları arasına denk gelecek şekilde bileğinizi serbest bırakarak vurunuz. (Normalde bu bölgede ses rezonans olarak duyulur. Mat duyulur ise retrosternal guatr düşünülür).\n\n**OSKÜLTASYON**\n34. Hastanın karşısına geçiniz ve steteskopun çan kısmını önce sağ, sonra sol tiroid lobu üzerine koyarak oskülte ediniz. Tiroid üzerinde üfürüm varsa kaydediniz.\n35. Tiroid kartilajın laterali ile sternokleidomastoid kas arasında karotis arter nabzını palpe ederek hissediniz.\n36. Sağ taraf karotis arter trasesini boyun tabanından çeneye kadar dinleyiniz.\n37. Sol taraf karotis arter trasesini boyun tabanından çeneye kadar dinleyiniz.\n38. Sağ ve sol subklaviyan arter trasesini oskülte ediniz.\n39. Hastaya muayenenin bittiğini, giyinebileceğini söyleyiniz.\n40. Elinizi yıkayınız ve hastaya bulgularınız ile ilgili bilgi veriniz.\n\n**NOT:** Eğitim videosunda da izleyeceğiniz gibi konu hakkında kitaplar okunduğu zaman gözden kaçabilecek olan önemli birkaç klinik nokta mevcuttur. Tiroid muayenesi her zaman diğer sistem muayeneleri ile birlikte yapılmalı ve değerlendirilmelidir. Lenf nodu muayenesi eş zamanlı yapılmalıdır. Trakeanın orta hatta olup olmadığı her zaman kontrol edilmelidir. Hastanın kilosu, zayıf olup olmadığı, sinirli olup olmadığı, stresli ajite olup olmadığı gözlemlenmeli, saç ve saçlı deri incelenmeli, tırnaklarda onikoliz olup olmadığı, parmaklarda akropaçi olup olmadığı değerlendirilmelidir. Hastalarda mutlaka ellerde ince tremor olup olmadığı muayene edilmeli, avuç içinin kuru mu nemli mi olduğu hissedilmelidir. Derin tendon refleksleri bakılmalı, pretibial veya genel ödem olup olmadığı değerlendirilmelidir. Bu hastalarda göz muayenesi çok önemlidir. Hastanın proksimal kas gücü değerlendirilmelidir. Hastanın başının üstünden ve yandan gözlerin öne çıkıp çıkmadığı incelenmeli, oftalmopleji muayenesi ve lid lag muayenesi videodaki gibi yapılmalı, hastanın nabzı palpe edilmeli, nabzın ritmi ve sayısı değerlendirilmelidir. Hastanın kalp seslerinin de oskülte edilmesi her tiroid muayenesinde tamamlanmalıdır."},
  {id:"toraks-muayene",title:"Toraks / Solunum Sistemi Muayenesi",cat:"muayene",content:"1. Hastayı iyi ışıklandırılmış (gün ışığı) ve ısısı en az 22 0C olan bir odada güler yüzle karşılayınız ve kendinizi tanıtınız. Hastadan muayenesini yapmak için iznini isteyiniz. Hastaya belden yukarısını soymasını söyleyiniz (kadın hastalarda göğüs ön duvarına örtü konulabilir).\n2. Daha sonra hastayı tabureye oturtarak ve ellerini göbek hizasında bağlayarak ya da sandalyeye ters olarak oturtarak, omuzlarını gevşek bırakmasını ve başını hafifçe öne eğmesini söyleyiniz.\n\n**İnspeksiyon**\n3. Toraksı tümüyle gözlemleyip, toraks duvarında herhangi bir patolojik bulgu olup olmadığına bakınız.\n4. Hastanın arkasında durup, her iki hemitoraksın eşit görünüp görünmediğine yukarıdan teğet olarak bakınız.\n5. Hastaya derin nefes alıp vermesini söyleyiniz ve her iki hemitoraksın solunuma eşit katılıp katılmadığını gözleyiniz.\n\n**Palpasyon**\n*Trakea palpasyonu*\n6. İşaret parmağınızın ucunu incisura jugularise koyup, trakea halkalarını hissediniz.\n7. Trakeanın sağında ve solunda, trakea ile sternocleidomastoid kası arasındaki mesafeyi hissediniz. Her iki mesafenin eşit olup olmadığını değerlendiriniz.\n\n*Ekspansiyon*\n8. Hastayı her iki skapulasının altından ve üstünden (parmak uçları skapula üst kenarında, baş parmak uçları vertebraya dik olacak şekilde) orta hatta pililer oluşturacak şekilde, iki elinizle kavrayınız.\n9. Hastaya derin soluk alıp vermesini söyleyiniz ve iki hemitoraksın da solunuma katılımın eşit olup olmadığını elinizle hissediniz.\n10. Aynı hareketleri hastayı koltuk altı ve meme altından kavrayarak tekrarlayınız.\n\n**Perküsyon**\n*Direkt perküsyon*\n11. Sağ elinizin işaret-orta ve yüzük parmaklarını birleştiriniz.\n12. El bileğinizi yumuşak bırakarak ve tüm toraksa (direkt kemik üstleri hariç) simetrik olacak şekilde vurarak çıkan sesi değerlendiriniz.\n\n*İndirekt Perküsyon*\n13. Sol elinizin parmaklarını açarak orta parmağınızı, boylu boyunca göğüs duvarına yerleştiriniz.\n14. Sağ elinizin orta parmağını, sol el (göğüs duvarına yerleştirdiği) orta parmağın birinci boğumuna denk gelecek şekilde bileğinizi serbest bırakarak vurunuz.\n15. Önce spina skapulaya paralel, sonra skapula-vertebra arasında vertebraya paralel, skapulanın altında kaburga aralıklarına girerek, perküsyon yapınız.\n17. Akciğer bazalinde sonor sesin matlaştığı yerde (kostofrenik sinüs), arka aksiler hat üzerinde parmağınızı sabit tutup, hastaya derin nefes alıp tutmasını söyleyiniz ve aynı yere tekrar vurunuz.\n18. Göğsün ön duvarının perküsyonu için hastayı sırt üstü yatırınız. Klavikula altından kosta yayına kadar kaburga aralıklarına girerek simetrik olarak perküte ediniz.\n\n**Oskültasyon**\n19. Stetoskopun diyaframını ısıtınız.\n20. Hastaya ağızdan derin derin ancak, ses çıkarmadan soluk alıp vermesini söyleyiniz.\n21. Stetoskopu koyduğunuz her yerde (skapula kenarında vertebraya, skapula altında kostalara paralel yerleştirerek) bir nefes alıp verme süresi kadar kalarak, akciğer seslerini dinleyiniz.\n22. Tüm göğüs duvarını arkadan, önden ve yandan olmak üzere simetrik olarak stetoskopla dinleyiniz.\n23. Hastaya göğüs muayenesinin bittiğini ve giyinebileceğini söyleyiniz. Gerekirse giyinmesine yardım ediniz.\n24. Ellerinizi yıkayınız.\n25. Hastaya muayeneniz ile ilgili bilgi veriniz."},
  {id:"dolasim-muayene",title:"Dolaşım Sistemi Muayenesi",cat:"muayene",content:"**Hazırlık**\n1. Ellerinizi yıkayınız. \n2. Hastaya yapılacak muayene hakkında bilgi veriniz ve onamını alınız.\n\n**İnspeksiyon**\nİnspeksiyon genel inspeksiyon ve toraks / prekordiyal bölgenin inspeksiyonu olmak üzere iki bölümde ele alınır. Genel inspeksiyonda inceleme hasta içeri girerken başlar, anamnez alırken gelişir ve muayene sırasında pekişir. Hastanın genel görünümü, yürüyüşü ve vücudun tüm parçalarının ayrı ayrı inspeksiyonu klinik tanının oluşmasında önemli katkı sağlar. Toraks ve prekordiyal bölgenin inspeksiyonu ile de toraksta mevcut olabilecek çeşitli deformitelerin kalbin lokalizasyonu ve fonksiyonlarına değişik derecelerdeki etkisi incelenir.\n\n**GENEL İNSPEKSİYON**\n1. Hastanın genel görünümünü ve yürüyüşünü inceleyiniz, vücut ağırlığını kabaca yorumlayınız. Solunum sıkıntısı, terleme var mı, bakınız.\n2. Hastanın yüzünü solukluk, siyanoz, malar rash, ksantelezma yönünden inceleyiniz.\n3. Hastanın ellerini ve alt ekstremitesini çomak parmak, siyanoz, lezyon ve ödem yönünden inceleyiniz.\n\n**PREKORDİYAL BÖLGENİN İNSPEKSİYONU (yaklaşık 30°\u0027 lik bir açıyla sırt üstü yatırınız.)**\n1. Toraksta deformite olup olmadığını inceleyiniz.\n2. Skar, pace-maker var mı, inceleyiniz.\n3. Pulsasyon olup olmadığını inceleyiniz. (Apekste, aşağı parasternal alanda, sağ ikinci-üçüncü interkostal aralıkta, subksifoid ve epigastrik bölgede).\n\n**KALBİN PALPASYONU**\nPalpasyonun amacı kalp ve büyük damarların hareketlerinin değerlendirilmesidir. Bu amaçla prekordiyal bölge bir bütün olarak palpe edilip genel olarak değerlendirilmelidir. Küçük alanda lokalize hareketlerin (apikal vuru, pulmoner arter pulsasyonu vb.) palpasyonu için parmak uçları, daha geniş alanda oluşan hareketlerin (sağ ventrikül hipertrofisine bağlı parasternal lift vb.) palpasyonu için ise el ayası kullanılır. Üfürümlerin palpe edilebilen vibrasyonları olan \"thrill\" palpasyonunda ise en hassas bölge distal metakarpal bölgedir. Palpasyon sırasında eş zamanlı olarak karotis arterlerin palpe edilmesi veya kalp oskültasyonu yapılması palpe edilen hareketlerin, kalp siklusunun hangi dönemine ait olduğunun anlaşılması için gereklidir.\n1. Apikal vuruyu palpe etmek için hastayı sırtüstü yatırınız.\n2. Sağ elinizin 2., 3. ve 4. parmaklarını, sırayla sol prekordiyal orta klaviküler hizada 4., 5. ve 6. interkostal aralıklara (İKA) yerleştiriniz ve pulsasyon hissetmeye çalışınız.\n3. Sağ elinizin 2, 3 ve 4. parmak uçlarını midklavikular hatta 5. interkostal aralığa (veya bir önceki basamakta pulsasyon hissettiğiniz alana) yerleştiriniz ve pulsasyonu hissetmeye çalışınız. (Yatar durumda palpe edilemiyorsa hasta sol lateral dekübitus pozisyonunda yatarken muayeneyi tekrarlayınız.).\n4. Apikal vuru hissedilebilir ise; çapın genişliğini, lokalizasyonu (kaçıncı interkostal aralıkta, midklavikular-orta aksiler hizada), sistolde el altında kalma süresini, şiddetini ve şeklini değerlendiriniz.\n5. Apikal alanı diyastolik pulsasyonlar (S3 ve S4) ve thrill açısından değerlendiriniz.\n6. Aşağı parasternal alanı diyastolik pulsasyonlar (S3 ve S4) ve thrill açısından değerlendiriniz.\n7. Sağ ventrikül hareketleri ve büyüklüğünün değerlendirilmesi için aşağı parasternal alanı sağ elinizin ayası ile eli kaldıran vuru varlığı açısından palpe ediniz. (Parasternal lift).\n\n**KALBİN OSKÜLTASYONU**\nBu uygulamada dolaşım sisteminin önemli organı olan kalbi değerlendirmek için oskültasyon yapma becerisi kazanacağız. Bir beceriyi öğrenmenin 8 kuralı vardır: Açıklama (explanation), gösterme (demonstration), taklit etme (imitation), tekrar (repetition), tekrar (repetition), tekrar (repetition), tekrar (repetition), tekrar (repetition). Kalp siklusu birbirini takip eden sistol (kanın sağ ventrikülden pulmoner artere ve sol ventrikülden aortaya ejeksiyonu) ve diyastol (sağ ventrikülün sağ atriumdan ve sol ventrikülün sol atriumdan gelen kanla doluşu) epizotlarından oluşur.\nSistol atriyoventriküler kapakların (mitral ve triküspit kapaklar) kapanması (S1) ile başlar, semiluner kapakların (aort ve pulmoner kapaklar) kapanması (S2) ile sona erer. Kalp oskültasyonu steteskop ile yapılır. Oskültasyon yapılırken steteskop cilde direk olarak temas etmelidir. Steteskop ciltle steteskop arasında hava sızmayacak şekilde optimal basınçla bastırılmalıdır. Steteskopun diyafram ve çan kısımları mevcuttur. Düşük frekanslı sesler çan kısmı ile (S3, S4, diyastolik rulman), yüksek frekanslı sesler (S1, S2, sistolik üfürümler) diyafram kısmı ile dinlenir. (Frekans oluşan sesin saniyede oluşturduğu titreşim sayısıdır.) Kardiyak siklusta üfürümler sistol veya diyastol sırasında veya devamlı olarak duyulabilir. Normal laminar akımda üfürüm duyulmaz, akımda oluşan türbülans üfürümün duyulmasına neden olur. Türbülans akım artışı veya akımın geçtiği bölgedeki daralma veya genişleme sonucu oluşur.\n1. Hastaya yapılacak muayene hakkında bilgi veriniz ve onamını alınız.\n2. Odanın kapı ve pencerelerini dış seslerin girmemesi için kapatınız, varsa radyo, televizyon gibi sesli cihazları da kapatınız.\n3. Hastanızı sırt üstü (supin pozisyonunda) yatırınız.\n4. Steteskopun kulaklıklarını yönü öne bakacak şekilde kulağa yerleştiriniz.\n5. Stetoskopunuzun iletken bölümünün diyafram tarafı olduğunu, diyaframına elinizi sürerek kontrol ediniz.\n6. Odakları dinlerken, önce ‘S1’ ve ‘S2’ yi ayırt etmeye çalışılmalı*, daha sonra sistol (S1-S2 arası) ve diyastol (S2-S1 arası) intervallerine odaklanarak, ek ses (açılma sesi/klik, ‘S3’, ‘S4’) ve üfürüm varlığı yönünden incelenmelidir.\n7. İkinci interkostal aralık, sağ sternal kenarda aort odağını dinleyiniz.\n8. İkinci interkostal aralık, sol sternal kenarda pulmoner odağını dinleyiniz.\n9. Sol sternal kenarda triküspit odağını dinleyiniz.\n10. Midklavikular hatta 5. interkostal aralıkta mitral odağını dinleyiniz.\n11. Hastanızı sol yan yatırılarak mitral odağını stetoskopunuzun ‘çan’ kısmı ile tekrar dinleyiniz.\n12. Hastaya giyinmesini söyleyiniz.\n13. Muayene bulgularınız ile ilgili bilgi veriniz.\n14. Muayene bulgularını hastanın dosyasına not ediniz.\n\n**S1’i ayırt etme:** Normal kalp hızlarında diyastol sistolden daha uzundur. Bu nedenle uzun pause sonrası duyulan kalp sesi S1, ardından gelen kalp sesi S2’dir. Kalp hızının yüksek olduğu durumlarda diyastol süresi kısalacağından S1-S2’yi ayırt etmek güç olabilir. Bu durumda oskültasyonla eş zamanlı carotis arter/ apikal vuru palpasyonu yapılabilir. Nabızın/vurunun hem öncesinde duyulan ses S1, sonrasında duyulan ses S2’dir. Ayrıca, normal koşullarda, aort ve pulmoner odaklarda S2; mitral ve triküspit odaklarda S1 daha şiddetli olarak duyulur.\n\n**Oskültasyon sırasında kullanılabilecek manevralar:** Vücut pozisyonundaki değişiklikler veya fizyolojik manevralar oskültatuar olayların zamanlamasını veya şiddetini değiştirebilir. Bu bulgular kalp sesleri veya üfürümlerin klinik değerlendirmesinde yardımcı olabilir. Yapılabilecek manevralar:\n*   Sol yana yatırma: S3 (sol ventrikül kaynaklı), mitral diyastolik rulman\n*   Oturup, öne eğilerek eksprium sonunda dinleme: AY üfürümü\n*   Çömelme/ayağa kalkma\n*   Valsalva manevrası\n*   Solunum (insprium)\n*   İsometrik handgrip-egzersiz"},
  {id:"periferik-nabiz",title:"Periferik Nabız Muayenesi",cat:"muayene",content:"**PERİFERİK NABIZ MUAYENESİ**\n\n1. Hastanızın sağ tarafında durunuz.\n2. Hastanızı oturtup sağ el başparmağı arkada, 2, 3, 4. parmaklar sternocloidemastoid kas ile larinks arasına yerleştirilerek karotis arter nabzını palpe ediniz.\n3. Hasta oturur iken hastanın sağ eli hekimin sağ eli ile kavranarak sol elin 2, 3, 4. parmakları ile bilek hizasında radius kemiğin hemen medialinde radial nabzını palpe ediniz. Nabızın hızını, ritmini ve dolgunluk derecesini değerlendiriniz.\n4. Hasta oturur iken hastanın kolunu dirsekten hafif fleksiyona getiriniz. Sağ el 2, 3, 4. parmak pulpaları dirsek iç yüzünde biceps tendonunun hemen medialinde brakial arter nabzını palpe ediniz.\n5. Hasta sırt üstü yatırılarak sağ tarafına geçilir, sağ elinizin 2. ve 3. parmakları inguinal ligamentin hemen altında, sympsis pubis ile spina iliaca anterior superior arasındaki çizginin 1/3 iç kısmına yerleştirilerek femoral arteri palpe ediniz.\n6. Hasta sırt üstü yatmaya devam ederken, sağ bacak hafif fleksiyona getirilerek, iki el baş parmağı patella üzerine yerleştirilir, diğer parmaklar popliteal fossada birbirine değecek şekilde yaklaştırılarak popliteal arteri palpe ediniz.\n7. 2. 3. ve 4. parmaklar ayak sırtında birinci ve ikinci metatarslar arasındaki çukurda arteria dorsalis pedisi palpe ediniz.\n8. Medial malleol’un arkasında arteria tibialis posterioru palpe ediniz.\n9. Hastaya giyinmesini söyleyiniz.\n10. Muayene bulgularınız ile ilgili bilgi veriniz."},
  {id:"karin-lenf",title:"Karın ve İnguinal Bölge Lenf Bezleri Muayenesi",cat:"muayene",content:"**Hazırlık**\n1. Yapılacak işlemin gerekçesini söyleyiniz.\n2. Yapılacak işlemi kısaca açıklayınız.\n3. Onamını alınız.\n4. Ellerinizi ılık su ile yıkayınız ve kurulayınız.\n5. Hastanın sağ tarafına geçerek muayeneye başlayınız.\n\n**İnspeksiyon**\n6. Karnın genel görünüşünü değerlendiriniz.\n7. Karın solunum hareketlerine katılıyor mu izleyiniz.\n8. Karın derisinde renk değişikliği, lekeler veya lezyonlar olup, olmadığını gözleyiniz.\n9. Genişlemiş venler var mı izleyiniz.\n10. Karında distansiyon ve lokal şişlik var mı izleyiniz.\n11. Karında asimetrik görünüm var mı izleyiniz.\n12. Barsak hareketleri görünüyor mu izleyiniz.\n13. Göbek normal görünüyor mu izleyiniz.\n14. Karında ameliyat insizyon skarı veya başka yara izi var mı izleyiniz.\n15. Hastadan ellerini kullanmadan oturmasını isteyiniz. Oturur iken Rektus diyastazı ve fıtık gelişimi var mı izleyiniz.\n16. Hastayı tekrar yatırıp, özellikle inguinal ve femoral fıtık bölgelerini izlerken, öksürmesini isteyiniz. Fıtıktan kuşkulanır iseniz daha sonra hastayı ayağa kaldırıp, inspeksiyonu yineleyiniz.\n17. Skrotuma veya labia major’a bakınız.\n\n**Palpasyon**\n18. Hastanın başının altına bir yastık koyarak başını hafif yükseltiniz, bacaklarını dizlerinden büküp karına yaklaştırarak karın kaslarının gevşemesini sağlayınız.\n19. Hastadan başını sol yana çevirmesini ve rahat nefes alıp vermesini isteyiniz.\n20. Hastaya sorular sorup, konuşturunuz.\n21. Karında ağrıyan bir bölge var ise, ağrıyan yerin en uzak noktasından muayeneye başlayınız.\n22. Sağ elinizin bütün parmaklarının volar yüzlerini karın üzerine koyunuz.\n23. Parmaklarınızı hafifçe karına bastırınız ve hafifçe döndürme hareketleri yapınız.\n24. Yüzeyel palpasyonla karnın tüm kadranlarını muayene ediniz.\n25. Derin palpasyon için ellinizin tümünü düz olarak karın üzerine koymayınız. Parmaklarınızın volar yüzleri biraz meyilli olarak karın üzerine koyunuz ve pulpalar ile hissediniz.\n26. Karnın tüm kadranlarını derin palpasyon ile muayene ediniz (Eğer ağrılı bir bölge yok ise sol alt, sol üst, sağ üst, sağ alt kadran sırası izlenir).\n27. Atletik ve şişman hastalarda derin palpasyon için sağ elinizin parmakları üzerine sol elinizin parmaklarını bastırarak muayene yapınız.\n28. Palpasyonda hastanın ağrı duyup duymadığını, karın kaslarını kasıp kasmadığını, karın içinde kitle bulunup, bulunmadığını değerlendiriniz.\n29. Palpasyonda elinize bir kitle gelip gelmediğini kaydediniz. Kitle varsa yerini, büyüklüğünü, kıvamını kaydediniz.\n30. Varsa dalak büyüklüğünü kaydediniz, sol kosta yayını orta klavikuler hatta ve ön aksiler hatta kaç cm. geçtiğini ölçerek yazınız.\n31. Varsa karaciğer büyüklüğünü kaydediniz, sağ kosta yayını orta klavikuler hatta ve ön aksiler hatta kaç cm. geçtiğini ölçerek yazınız. Gerekiyorsa ksifoid altında da ölçünüz.\n32. Karaciğer büyüklüğü varsa kıvamını, ağrılı olup olmadığını, yüzeyinin karakterini değerlendiriniz.\n33. İnguinal bölge lenf bezlerini muayene etmek için muayene eldiveninizi giyiniz.\n34. Bu uygulama için hastadan pantolonunu her 2 kasık bölgesi rahatça görüntülenecek şekilde indirmesini isteyiniz ve hastanın üzerini örtünüz.\n35. İşaret, orta ve yüzük parmaklarınızı yan yana getiriniz.\n36. Parmaklarınızın uçlarını hafifçe bastırarak, aşağıda sıralanan lenf bezi bölgelerinde lenf bezi palpasyonu yapınız. 36a - Yüzeyel inguinal bölge lenf bezleri, 36b - Derin inguinal bölge lenf bezleri, 36c - Femoral bölge lenf bezleri.\n37. Lenf bezleri var ise, patolojik boyutta olup olmadıklarını, ağrılı olup olmadıklarını, çevreye fikse olup, olmadıklarını değerlendiriniz.\n38. Patolojik lenf bezleri ilgili boyut, kıvam, ağrılı palpasyon, fiksasyon ve cilt rengi vb. özellikleri not ediniz.\n\n**Perküsyon**\n39. Sol elin 3. parmağı üzerine bilek gevşek tutularak sağ elin 2. ve 3. parmakları ile vurunuz.\n40. Sağ üst kadranda 4. interkostal aralıktan başlayarak sağ inguinal bölgeye kadar perküsyon yapınız.\n41. Karaciğer matitesinin nerede başlayıp nerede bittiğini not ediniz, ek matite olup olmadığını tesbit ediniz.\n42. Sol tarafta Traube aralığından başlayarak sol inguinal bölgeye kadar perküsyon yapınız.\n43. Traube aralığında mat veya timpan ses alındığını belirtiniz.\n44. Ksifoid çıkıntıdan itibaren ışınsal yönlerde os pubis ve inguinal bölgelere uzanan çizgiler doğrultusunda perküsyon yapınız.\n45. Karında matite varsa yeri ve açıklığın baktığı yönü belirtiniz.\n46. Karında kitle varsa sınırlarını belirleyiniz.\n\n**Oskültasyon ve Bitiş**\n47. Sağ üst kadrandan başlayarak saatin ters yönünde her dört kadranı stetoskop ile dinleyiniz.\n48. Dinleme her kadranda en az 5 solunum süresi kadar sürmelidir.\n49. Orta hatta üfürüm olup olmadığını değerlendiriniz.\n50. Üst abdomende tek taraflı, diastolik komponenti de olabilen üfürümün varlığını değerlendiriniz.\n51. Eğer kitle tespit edilmişse stetoskopu üzerine koyup üfürüm var mı belirleyiniz.\n52. Muayeneniz bitince ellerinizi yıkayınız.\n53. Hastaya muayeneniz ile ilgili bilgi veriniz."}

let currentId=null,drawerOpen=false;

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function inline(s){s=esc(s);s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");s=s.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,"<em>$1</em>");return s}
function renderMd(text){
  const lines=text.split("\n");let html="",lt=null;
  function cl(){if(lt){html+="</"+lt+">";lt=null;}}
  function op(t){if(lt!==t){cl();html+="<"+t+">";lt=t;}}
  for(let raw of lines){
    const line=raw.trim();
    if(!line){cl();continue;}
    if(/^\*\*[^*]+\*\*$/.test(line)){cl();html+="<h3>"+inline(line.slice(2,-2))+"</h3>";continue;}
    const om=line.match(/^(\d+)\.\s+(.*)/);
    if(om){op("ol");html+="<li><span class='sn'>"+om[1]+"</span><span>"+inline(om[2])+"</span></li>";continue;}
    const um=line.match(/^\*\s+(.*)/);
    if(um){op("ul");html+="<li>"+inline(um[1])+"</li>";continue;}
    cl();html+="<p>"+inline(line)+"</p>";
  }
  cl();return html;
}

function toggleDrawer(){drawerOpen?closeDrawer():openDrawer();}
function openDrawer(){drawerOpen=true;document.getElementById("drawer").classList.add("open");document.getElementById("overlay").classList.add("show");document.getElementById("hamburger").classList.add("open");}
function closeDrawer(){drawerOpen=false;document.getElementById("drawer").classList.remove("open");document.getElementById("overlay").classList.remove("show");document.getElementById("hamburger").classList.remove("open");}

function buildDrawer(filter){
  const nav=document.getElementById("drawer-nav");nav.innerHTML="";
  catOrder.forEach(cat=>{
    const items=lessons.filter(l=>l.cat===cat&&(!filter||l.title.toLowerCase().includes(filter)));
    if(!items.length)return;
    const lbl=document.createElement("span");lbl.className="d-cat";lbl.textContent=catNames[cat];nav.appendChild(lbl);
    items.forEach(l=>{
      const btn=document.createElement("button");
      btn.className="d-btn"+(l.id===currentId?" active":"");
      btn.textContent=l.title;
      btn.onclick=()=>{openLesson(l.id);closeDrawer();};
      nav.appendChild(btn);
    });
  });
}
document.getElementById("drawer-search").addEventListener("input",function(){buildDrawer(this.value.toLowerCase().trim()||null);});

function buildHome(filter){
  const c=document.getElementById("home-cats");c.innerHTML="";
  catOrder.forEach(cat=>{
    const items=lessons.filter(l=>l.cat===cat&&(!filter||l.title.toLowerCase().includes(filter)));
    if(!items.length)return;
    const sec=document.createElement("div");sec.className="cat-section";
    sec.innerHTML='<div class="cat-section-title">'+catNames[cat]+'</div><div class="cards-grid"></div>';
    const grid=sec.querySelector(".cards-grid");
    items.forEach(l=>{
      const card=document.createElement("div");card.className="card";
      const dot=lessonVideos[l.id]?'<div class="card-dot" title="Video mevcut"></div>':"";
      card.innerHTML=dot+'<span class="card-badge badge-'+l.cat+'">'+catNames[l.cat].split(" ")[0]+'</span><div class="card-title">'+esc(l.title)+'</div>';
      card.onclick=()=>openLesson(l.id);
      grid.appendChild(card);
    });
    c.appendChild(sec);
  });
}
document.getElementById("home-search").addEventListener("input",function(){buildHome(this.value.toLowerCase().trim()||null);});

function openLesson(id){
  const l=lessons.find(x=>x.id===id);if(!l)return;
  currentId=id;
  history.pushState({id},l.title,"#"+id);
  document.getElementById("page-home").style.display="none";
  document.getElementById("page-lesson").style.display="block";
  document.getElementById("home-btn").style.display="block";
  document.getElementById("nav-title").textContent=l.title;
  const pill=document.getElementById("lesson-cat-pill");
  pill.textContent=catNames[l.cat];pill.className="lesson-cat-pill badge-"+l.cat;
  document.getElementById("lesson-title").textContent=l.title;
  const vids=lessonVideos[id];
  document.getElementById("lesson-videos").innerHTML=vids
    ?'<div class="video-section"><div class="video-section-head">&#127909; Video Kaynakları</div><div class="video-links">'+vids.map(v=>'<a class="video-link" href="'+v.u+'" target="_blank" rel="noopener">&#9654; '+esc(v.t)+'</a>').join("")+'</div></div>'
    :"";
  document.getElementById("lesson-body").innerHTML=renderMd(l.content);
  window.scrollTo(0,0);
  buildDrawer();
}

function goHome(){
  currentId=null;
  history.pushState({},"NYKS","#");
  document.getElementById("page-lesson").style.display="none";
  document.getElementById("page-home").style.display="block";
  document.getElementById("home-btn").style.display="none";
  document.getElementById("nav-title").textContent="NYKS – Mesleksel Beceriler";
  closeDrawer();
  buildDrawer();
}

window.addEventListener("popstate",function(e){
  const id=location.hash.slice(1);
  if(id&&lessons.find(l=>l.id===id))openLesson(id);
  else goHome();
});
