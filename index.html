<script>
const lessons = [
  {id:"el-yikama",title:"El Yıkama Becerisi",cat:"temel",content:"**HİJYENİK EL YIKAMA BECERİSİ BASAMAKLARI**\n\n1. Giysinizin kollarını el bileklerini ortaya çıkaracak biçimde katlayınız.\n2. Saat, yüzük, bilezik vb. takılarınızı çıkarınız.\n3. Musluğu açınız.\n4. Elleriniz akan suyun altında ıslatınız.\n5. Elinize sabun ya da bir miktar temizleyici çözelti alınız.\n6. Bir miktar su ile sabun ya da çözeltiyi köpürtünüz.\n7. Eğer sabun kullanılıyor ise, ellerinizin köpüğünü koruyarak sabunu durulayıp yerine bırakınız.\n8. Elde kalan köpükle aşağıdaki şekilde tanımlanan hareketleri sıra ile en az beşer kez yineleyerek ellerinizi yıkayınız (çeşitli yönlere rotasyonlar yaparak):\n9. Avuç içleri birbiriyle temas ederek,\n10. Sağ avuç içi sol el sırtı üzerinde temas ederek,\n11. Sol avuç içi sağ el sırtı üzerinde temas ederek,\n12. Avuç içleri birbiriyle temas ederken parmak araları da birbirinin içine geçmiş olarak,\n13. Sağ elin parmakları kapalı ve fleksiyonda iken, parmakların arka yüzlerini sol elin avuç içi ile temas ederek,\n14. Sol elin parmakları kapalı ve fleksiyonda iken, parmakların arka yüzlerini sağ elin avuç içi ile temas ederek,\n15. Sağ başparmak, sol avuç içine alınarak,\n16. Sol başparmak, sağ avuç içine alınarak,\n17. Sağ elin tüm parmak uçları sol avuç içine alınarak,\n18. Sol elin tüm parmak uçları sağ avuç içine alınarak,\n19. Sağ el bileği sol el içine alınarak,\n20. Sol el bileği sağ el içine alınarak,\n21. Akan suyun altında köpüğü tamamen akıtarak, ellerinizi durulayınız.\n22. Eğer vidalı ise, musluk vidası üzerine elle su akıtılarak durulayınız ve musluğu kapatınız. Eğer kollu musluk ise dirsek ile musluğu kapatınız.\n23. Ellerinizi kurulayınız."},
  {id:"steril-eldiven",title:"Steril Eldiven Giyme ve Çıkarma Becerisi",cat:"temel",content:"**Steril Eldiven Kullanımının Amacı ve Önemi:**\nEldiven giymek, hem ellerimize zararlı etkenlerin bulaşmasını engelleyerek kendimizi, hem de hastamızı ellerimizden bulaşacak mikroorganizmalardan korumada yardımcı olur. **Vücudun steril bölgelerine yapılan müdahalelerde, açık yaralarda ve kullanılan malzemenin sterilliğinin korunması durumunda steril (cerrahi) eldiven giyilmelidir**. Eldiven giymeden önce ve çıkardıktan sonra ellerin yıkanmasına mutlaka dikkat edilmelidir. Ayrıca eldivenlerin ince olduğu, sert hareketler veya keskin cisimler ile delinebileceği unutulmamalıdır. \n\nKaynak belgedeki \"Steril Eldiven Giyme ve Çıkarma Becerisi\" aşamalarının sıralamasını ve içeriğini değiştirmeden numaralandırılmış tam listesi aşağıdadır *(Not: Kaynak metinde 12. madde atlanarak 13. maddeye geçilmiştir)*:\n\n**STERİL ELDİVEN GİYME VE ÇIKARMA BECERİSİ BASAMAKLARI**\n\n1. Ellerinizi yıkayıp, kurulayınız.\n2. Eldiven paketinin yırtık olup olmadığını ve son kullanma tarihini kontrol ediniz.\n3. Steril eldiven paketini, içindeki kağıt ambalaji yırtmadan açınız.\n4. Eldivenlerin sterilliğini bozmadan, bilek kısımları kendinize doğru gelecek şekilde paketi çeviriniz.\n5. Sol eliniz ile sağ el için olan eldiveni boynundan tutunuz.\n6. Eldivenin başparmağının iç tarafta olduğunu görünüz.\n7. Sağ elinizi eldivenin içine sokunuz.\n8. Tüm parmaklarınızın yerlerine yerleştiğinden emin olunuz.\n9. Parmaklar yerleşince elinizi eldivenin içine sokar iken, sol elinizle eldiveni bileğinize doğru çekiniz.\n10. Şimdi sağ eliniz ile eldivenin diğer çiftini başparmak iç tarafa gelecek biçimde elinize alıp boyun kısmını dışarıdan tutup, elinizin üstüne katlayınız.\n11. Sol elinizi eldivenin içine ilerletiniz. Parmaklarınızı yerleştiriniz.\n13. Elinizi eldivene sokar iken, sağ elinizle eldivenin boynunu bileğinizden yukarı doğru çekiniz.\n14. Eldiven ile yapacağınız eylemi gerçekleştiriniz.\n\n**Kullanılmış Eldiveni Çıkarma**\n15. Bir elinizin 1. ve 2. parmağı ile diğer eldeki eldiven bileğinin boyun kısmını tutup dışa katlayıp, sıkıca kavrayınız.\n16. Eldiveni tutulan bölgeden çekerek dış yüzeyi içeride kalacak şekilde çıkarınız.\n17. Çıkardığınız eldiveni çıplak elle dış yüzeyine dokunmadan, eldivenli elin avuç içine alınız.\n18. Eldivensiz elinizin 2. ve 3. parmağı ile diğer eldeki eldiven bileğinin iç yüzeyinden sıkıca tutunuz.\n19. Tutulan bölgeden çekerek eldivenin dış yüzeyi ve diğer eldiven teki içeride kalacak şekilde çıkarınız.\n20. Eldivenleri ilgili atık kutularına atınız.\n21. Ellerinizi yıkayınız."},
  {id:"radial-nabiz",title:"Radial Arterden Nabız Sayma Becerisi",cat:"temel",content:"**RADİAL ARTERDEN NABIZ SAYMA BECERİSİ BASAMAKLARI**\n\n1. Hastanın doğru kişi olduğunu kontrol ediniz.\n2. Kendinizi tanıtınız.\n3. Yapılacak işlemi ve gerekçesini kısaca açıklayınız. Hastanın sizi doğru anlayıp anlamadığın kontrol ediniz ve soru sormasına fırsat veriniz.\n4. Hastanın onamını alınız.\n5. Ellerinizi yıkayınız.\n6. Hasta merdiven çıkmış, yürümüş, yorgun vb. durumda ise, 5-10 dk. dinlenmesini sağlayınız.\n7. Hastaya sırtüstü yatış veya oturur pozisyon veriniz.\n8. Nabız sayısı ölçülecek hastanın avuç içi yere bakacak biçimde bileğine pozisyon veriniz.\n9. İşaret, orta ve yüzük parmaklarınızı radial arter trasesi üzerine yerleştiriniz.\n10. Radial arteri palpe ediniz.\n11. Nabız atımlarını hissetmeye başladığınız andan itibaren, atımları 60 sn. süreyle sayınız.\n12. Nabız sayısını, ritmini ve dolgunluğunu kaydediniz.\n13. Ellerinizi yıkayınız."},
  {id:"solunum-sayisi",title:"Solunum Sayısı Sayma Becerisi",cat:"temel",content:"**SOLUNUM SAYISI SAYMA BECERİSİ BASAMAKLARI**\n\n1. Hastanın doğru kişi olduğunu kontrol ediniz. \n2. Kendinizi tanıtınız.\n3. Yapılacak işlemi ve gerekçesini kısaca açıklayınız. Hastanın sizi doğru anlayıp anlamadığın kontrol ediniz ve soru sormasına fırsat veriniz.\n4. Hastanın onamını alınız. \n5. Ellerinizi yıkayınız.\n6. Hasta merdiven çıkmış, yürümüş, yorgun vb. durumda ise, 5-10 dk. dinlenmesini sağlayınız.\n7. Hastanın gizliliğini sağlayacak önlemleri alınız. \n8. Hastanın vücudunun üst kısmındaki giysileri çıkarmasını isteyiniz.\n9. Hastaya sırtüstü uzanmasını söyleyiniz ve el ayanızı, hastanın epigastrik bölgesine yerleştirerek, 60 sn. boyunca solunum sayısını sayınız.\n10. Solunum sayısını kaydediniz. \n11. Hastaya giyinmesini söyleyiniz. \n12. Ellerinizi yıkayınız."},
  {id:"arteryal-kan",title:"Arteryal Kan Basıncı Ölçme Becerisi",cat:"temel",content:"**ARTERYEL KAN BASINCI ÖLÇME BECERİSİ BASAMAKLARI**\n\n1. Hastanın doğru kişi olduğunu kontrol ediniz.\n2. Kendinizi tanıtınız.\n3. Yapılacak işlemi ve gerekçesini kısaca açıklayınız. Hastanın sizi doğru anlayıp anlamadığın kontrol ediniz ve soru sormasına fırsat veriniz.\n4. Hastanın onamını alınız.\n5. Ellerinizi yıkayınız.\n6. Ortam sıcaklığının aşırı sıcak veya soğuk olmamasını sağlayınız. Kan basıncı ölçülecek kişiyi sakin ve sessiz bir ortamda oturtunuz.\n7. Sırtının geriye yaslı olmasına, ayaklarının yere basıyor olmasına ve bacak bacak üzerine atmamış olmasına dikkat ediniz.\n8. Kişinin; dinlenmiş, sakin olduğunu, son 15 dakika içinde sigara, kahve gibi kan basıncını etkileyebilecek şeyler almadığını ve mesanesinin çok dolu olmadığını sorgulayıp, kontrol ediniz.\n9. Kan basıncı ölçülecek kolda, üstten bası yapabilecek giysinin çıkarılmasını sağlayınız (böylece ek basınca neden olunmasını önleyiniz).\n10. Kolu; kalp düzeyinde, hafif fleksiyon pozisyonunda gerekir ise alttan yastık gibi bir cisimle destekleyerek ölçüm için hazırlayınız.\n11. Sfigmomanometre ve stetoskobu hazır hale getiriniz. Kişinin kol yapısı ile uyumlu boyutta manşon genişliğinin olmasına dikkat ediniz.\n12. Manşon havasını boşaltınız.\n13. Manşonu: Dirsek kıvrımının 3-4 cm üst kısmına, İçindeki hava torbası brakial arteri ortalayacak şekilde, Kola tam oturacak şekilde, yeterli sıkılıkta, İçindeki hava torbası katlanmadan, Hava boruları brakial arter trasesine gelmeyecek biçimde, kola sarınız.\n14. Stetoskobun kulaklığını dış kulak yolunu kapatacak şekilde (kulaklıkların uçları öne bakacak biçimde) takınız. Tambura dokunarak ses duyulup duyulmadığını kontrol ediniz.\n15. Brakial arterin trasesi üzerinden (dirsek eklemi ön yüz, medial taraftan) arter nabzını 4 parmakla palpe ediniz.\n16. Stetoskobun tamburunu; brakiyal arter nabzının hissedildiği bölgeye, manşonun altına gelmeyecek şekilde, yerleştiriniz. Fazla bastırmadan bir elinizle orada tutunuz.\n17. Ölçüm yapılırken hastanın konuşmasına izin vermeyiniz.\n18. Diğer elinizle puar musluğunu kapatarak manşon basıncını, ölçüm yapılan kişide beklenen sistolik arter basıncından 15-20 mm Hg daha yüksek olacak şekilde arttırınız, ya da manşon basıncını arttırırken Korotkoff seslerini dinleyiniz ve manşon basıncını seslerin kesildiği basınçtan 15-20 mm Hg daha yüksek olacak şekilde arttırınız.\n19. Puar musluğunu yavaşça açarak manşon basıncını saniyede 1-2 mm Hg hızla düşürürken Korotkoff seslerini takip ediniz.\n20. Seslerin ilk duyulduğu anda manometreden okunan basıncı sistolik basınç olarak saptayınız.\n21. Seslerin kaybolduğu anda okunan basıncı diastolik basınç olarak saptayınız.\n22. Sesler kesildikten sonra da stetoskobu kulaktan çıkartmadan, manşon basıncını aynı hızda boşaltarak, basınç 0 mmHg’ya ininceye kadar sesleri takip ediniz. Bu sırada tekrar Korotkoff sesleri duyulursa, diastolik basınç değerini seslerin tekrar kesildiği andaki manşon basıncı olarak kabul ediniz.\n23. Stetoskobu kulağınızdan çıkarınız.\n24. Havası boşaltılan manşonu koldan çıkarınız.\n25. Kan basıncını ölçtüğünüz kişiye bilgi veriniz.\n26. 1-2 dakika ara ile iki ölçüm alınız. İki ölçüm değerinin ortalamasını sistolik ve diyastolik olarak, birimini de (mmHg) ekleyerek kayıt ediniz.\n27. İlk kez kan basıncı ölçümü yapılan bir hastada her iki koldan ayrı ayrı ölçüm yapmayı ve iki taraf arasında fark varsa yüksek olan tarafı göz önüne almayı ve sonraki ölçümlerde takibin yüksek olan taraftan yapılması gerektiğini söylemeyi unutmayınız.\n28. Ellerinizi yıkayınız."},
  {id:"tyd",title:"Temel Yaşam Desteği Sağlama",cat:"temel",content:"**ÜÇLÜ HAVAYOLU AÇMA MANEVRASI VE AİRWAY YERLEŞTİRME**\n\n**Ağız İçini Temizleme ve Üçlü Havayolu Açma Manevrası**\n1. Mümkünse ellerinizi yıkayınız ve eldiven giyiniz.\n2. Hastanın sert bir zeminde sırt üst yatmasını sağlayınız.\n3. Hastanın baş tarafına geçiniz.\n4. Hastanın boyun bölgesini hızla gözden geçiriniz.\n5. Hastanın servikal (boyun) travma geçirip geçirmediğini ortaya koyunuz (servikal travma var ise 8 adıma gidiniz).\n6. Hastanın travması olmadığı ortaya çıkarıldıktan sonra başı bir elle ensenin biraz üstünden tutularak diğer elle frontal bölgeden aşağıya doğru iterek başın ekstansiyona *gelmesini sağlayınız. (Servikal travma var ise baş KESİNLİKLE ekstansiyona getirilmemelidir)*\n7. Hastanın ağzını tek eliniz ile mümkün olduğunca açınız.\n8. Görülebilen ağız içi yapıları ve yabancı cisimleri inceleyiniz.\n9. İşaret ve orta parmağınızı hastanın ağzının içine sokunuz. (Eldiven giymediyseniz uygun bir bez parçasını iki parmağınıza sararak.)\n10. Parmaklarınıza kaşık vazifesi vererek ağız içi yabancı cisimleri sıvazlayarak çıkartınız.\n11. Aspiratör kullanma imkanı varsa hastanın ağzının içini uygun aspiratör ucu kullanarak temizleyiniz.\n12. Her iki elin işaret parmakları ile hastanın çenesinin her iki tarafındaki çene kenarlarını hissediniz.\n13. Her iki elin işaret parmağı ile hastanın çenesinin iki tarafındaki çene kenarlarından tutularak çene yukarı doğru kaldırılır.\n14. Her iki elin başparmağı ile hastanın çenesinin ucunu hissediniz.\n15. Her iki elin başparmağı ile hastanın çenesinin ucu bastırılarak ağzının açılması sağlayınız.\n\n**Airway Yerleştirme**\n1. Mümkünse ellerinizi yıkayınız ve eldiven giyiniz.\n2. Hastanın yerde ve sırt üst yatmasını sağlayınız.\n3. Hastanın baş tarafına geçiniz.\n4. Hastanın boyun ve ağız bölgesini hızla gözden geçiriniz.\n5. Hastanın dişlerini kontrol ediniz.\n6. Hasta için uygun boyuttaki airway’i seçiniz. (#0-1 yenidoğan ve bebek, #2, çocuk, #3 erişkin kadın, #4-5 erişkin erkek).\n7. Hastanın ağzını tek eliniz ile mümkün olduğunca açınız.\n8. Airway, açıklığı hastanın yüzüne bakacak şekilde (ters olarak) ağza sokunuz.\n9. 1-2 cm ilerletildikten sonra açılığı yukarı bakacak şekilde (180o) döndürünüz.\n10. Ağıza tamamen oturacak kadar ilerletiniz.\n\n---\n\n**HEMLİCH MANEVRASI UYGULAMA**\n\n**Yatar Pozisyonda Hemlich Manevrası Uygulama**\n1. Hastanın sırt üstü yatmasını sağlayınız ve hastanın karşısından dizüstü çökünüz.\n2. Ellerinizi hastanın epigastriyumunda birleştiriniz.\n3. Epigastriyum ani olarak yukarı doğru sıvazlanır.\n4. Hastanın havayolundaki tıkayıcı olayın durumunu kontrol et. Sorun devam ediyorsa manevrayı tekrarlayınız.\n\n**Ayakta Hemlich Manevrası Uygulama**\n1. Mümkünse hastayı ayağa kaldırınız ve hastanın arkasına geçiniz.\n2. Ayaktaki hastanın arkasında durunuz.\n3. Arkasından önüne doğru kollarınızı uzatın ve epigastriumda elleriniz birleştirerek yumruk yapınız.\n4. Ayaktaki hastada epigastriyum bölgesine ani olarak bastırarak hastayı yukarı doğru kaldıracak bir hareket yapınız.\n5. Hastanın havayolundaki tıkayıcı olayın durumunu kontrol ediniz.\n6. Sorun devam ediyorsa manevrayı tekrarlayınız.\n\n**Bebekte Hemlich Manevrası Uygulama**\n1. Bebeği, dominat olmayan el-kol üzerine yüzü aşağıya bakacak şekilde yatırınız.\n2. Dominant el çocuğun sırtına yerleştiriniz.\n3. Ani bir hareketle sırtı sıvazlayınız.\n4. Hastanın havayolundaki tıkayıcı olayın durumunu kontrol et.\n5. Sorun devam ediyorsa manevrayı tekrarlayınız.\n\n---\n\n**AĞIZDAN AĞIZA YAPAY SOLUNUM VE KAPALI KALP-GÖĞÜS MASAJI**\n\n**Ağızdan Ağıza Yapay Solunum**\n1. Hastayı sert bir zemine sırt üstü yatırınız.\n2. Hastanın başının yakınında, omzunun yanına geçiniz ve diz üstü çömeliniz.\n3. Hastanın başını ekstansiyona getiriniz. (Servikal travma varlığında ekstansiyon uygulamayınız).\n4. Hastanın ağzını açınız.\n5. Hastanın ağzının içini yabancı cisimler açısından inceleyiniz. Yabancı cisimler varsa temizleyerek ortamdan uzaklaştırınız.\n6. Bir bez ya da mendili hastanın ağzını kaplayacak şekilde yerleştiriniz.\n7. Bir eliniz ile hastanın burnunu tıkayınız.\n8. Derin bir inspirasyon yapınız.\n9. Ağzınızı açıp, hastanın ağzının tümünü içine alacak şekilde hastanın ağzını kaplayınız.\n10. Güçlü bir ekspiryum ile inspire etmiş olduğunuz havayı 3-4 sn süre ile hastanın ağzından üfleyiniz (Hastanın göğüs kafesinin kalktığını gözlemleyiniz).\n11. Hastanın nefes vermesi ve sizin nefes almanız için hastanın ağzından ağzınızı ayrınız.\n12. 8. basamağa geri dönüp, basamakları yineleyiniz.\n*Not:* Küçük bebek ve çocuklarda, mendil ağız ve buruna kapatılıp, 9’uncu basamak ağız, ağız ve burunu kapatacak biçimde uygulanabilir.\n\n**Erişkinde Kapalı Kalp-Göğüs Masajı**\n1. Mümkünse eldiven giyiniz.\n2. Hastanın sert bir zeminde sırt üst yatmasını sağlayınız.\n3. Hastanın yan tarafına geçarak diz çökünüz.\n4. Hastanın sternumunu elinizle hissediniz.\n5. Hastanın sternumunun orta hattı üzerinde, tam ortasına dominant elinizin ayası denk gelecek şekilde yerleştiriniz.\n6. Diğer elinizi ya yumruk yaparak, ya da avuç içi ile diğer elin üstüne yerleştiriniz.\n7. Dirseklerinizi kilitleyiniz. (kesinlikle dirsekler kırılmamalıdır)\n8. Vücudunuzun ağırlığını kollarınıza aktarınız.\n9. Sternumun 4-5 cm kadar aşağıya inmesini sağlayınız.\n10. Sternumun geriye yükselmesi için baskıyı kaldırınız.\n11. Hiç ara verilmeden uygulandığında dakikada 100 adet olacak şekilde 10 ve 11 nolu basamakları yineleyiniz.\n\n**Çocukta-Yeni Doğanda Kapalı Kalp-Göğüs Masajı**\n1. Mümkünse eldiven giyiniz.\n2. Hastanın sert bir zeminde sırt üst yatmasını sağlayınız.\n3. Hastanın ayak tarafına geçiniz.\n4. Diz üstü çömeliniz.\n5. Yeni doğanın göğüsünü elin parmakları sırta, baş parmaklar ise meme başlarını birleştiren çizginin sternum orta hattını kestiği noktaya gelecek şekilde kavrayınız.\n6. Yeni doğanın göğüsünü yaklaşık olarak 1 cm bastırınız.\n7. Göğüse yaptığınız baskıyı kaldırınız.\n8. Hiç ara verilmeden uygulandığında dakikada 120 adet olacak şekilde 6 ve 7 nolu basamakları yineleyiniz.\n\n*Alternatif yöntem:*\n1. Hastanın yan tarafına geçiniz.\n2. Diz üstü çömeliniz.\n3. Yeni doğanın meme başlarını birleştiren çizginin sternum orta hattını kestiği noktaya gelecek şekilde bir elinizin işaret ve orta parmaklarını yerleştiriniz.\n4. Yeni doğanın göğüsünü parmaklarınızla yaklaşık olarak 1 cm bastırınız.\n5. Göğse yaptığınız baskıyı kaldırınız.\n6. Hiç ara verilmeden uygulandığında dakikada 120 adet olacak şekilde 4 ve 5 nolu basamakları yineleyiniz."},
  {id:"dis-kanama",title:"Dış Kanama Kontrolü Becerisi",cat:"temel",content:"**DIŞ KANAMA KONTROLÜ BECERİSİ BASAMAKLARI**\n\n1. Kanayan yer üzerine parmak ya da temiz bir bez ile baskı yapınız.\n2. Kanama durmuyor ise el ayasını kullanarak baskıyı artırınız.\n3. Kanama duruncaya kadar baskı uygulamaya devam ediniz.\n4. Yaranın uç tarafında renk değişikliği ve nabız kontrolü yapınız.\n\n**Sargı Uygulaması**\n1. Kanayan yer üzerine birkaç kat temiz bir bez koyunuz.\n2. Bez üzerinden sargı yapınız.\n3. Sargı yaparken kanama duracak kadar sıkıştırınız.\n4. Sargının düğümünü yaranın aksi yönüne gelecek şekilde atınız.\n5. Yaranın uç tarafında renk değişikliği ve nabız kontrolü yapınız.\n6. Kazazedeyi sırt üstü yatırınız.\n7. Ayaklarının altına 20 cm kaldıracak şekilde bir destek koyunuz.\n8. Yaralının sargısı görülecek şekilde battaniye örtünüz.\n9. 3-5 dakika ara ile solunum ve nabzı kontrol ediniz.\n10. Sargı kan ile ıslandı ise, sargıyı açmadan üzerine ikinci bir sargı ile baskı yapınız.\n\n**Turnike Uygulaması**\n1. Baskı noktasından bir elle baskı uygulayınız.\n2. Diğer ele 6-8cm genişlikte, kuvvetli ve esnemeyen bir materyal alınız.\n3. Tek kemik olan bölgeye basit sargı uygulayınız ve sargı uçlarını düğümleyiniz.\n4. Sargının içinden sert bir cisim (kalem vb) geçiriniz ve kanama durana kadar cismi kendi ekseni etrafında döndürünüz.\n5. Sert cismi uzva dik konuma getirerek çözülmeyecek şekilde tespit ediniz.\n6. Yaralının elbisesinin üzerine yaralının adı soyadı, turnikenin uygulanma zamanı (saat ve dakika) yazılı bir kart iğneleyiniz.\n7. Çok sayıda yaralı olduğunda, yaralının alnına sabit kalemle “T” veya “turnike” yazınız.\n8. Yaralının üzerini turnikesi görülecek şekilde battaniye ile örtünüz.\n9. Uygulamanın uzun sürmesi durumunda 20 dakika aralıklarla birkaç saniye süre ile gevşetiniz, sonra tekrar sıkınız."},
  {id:"boyun-tespit",title:"İlk Yardımda Kazazedenin Boynunun Tespiti Becerisi",cat:"temel",content:"**Boyun Tespiti Beceri Basamakları**\n1. Hastanın yerinden oynatılmadan, sabit bir şekilde durmasını sağlayınız.\n2. Servikal koları hazırlayınız.\n3. Boynu sabitlerken başparmaklar klavikulalar üzerinde, diğer dört parmak arkada skapula üzerinde olacak şekilde sıkıca kavrayınız, bu sırada her iki önkol ile hastanın başını destekleyiniz.\n4. Bir kişi boynu sabitlerken, diğer kişi servikal koları boynun arkasından geçirmelidir.\n5. Serival koların ön parçasını çeneye uyacak şekilde yerleştirip velkro bantları aracılığı ile sabitleyiniz.\n\n**Vertebra Tespiti Beceri Basamakları**\n1. Travma tahtasını hazırlayınız.\n2. Bir kişi “Boyun tespiti Basamak 3”teki gibi boynu sabitlerken diğer kişi, omuz ve kalçasından tutmalıdır.\n3. İki kişi koordineli şekilde kontrollü biçimde hastayı yana çeviriniz.\n4. Hasta sabit şekilde bu pozisyonda tutulurken travma tahtasını hastanın altına doğru ilerletiniz.\n5. Hastayı yine koordineli şekilde ve kontrollü olarak supin pozisyona çeviriniz; travma tahtasını tam ortalayacak şekilde hastayı, tahta üzerinde kontrollü olarak kaydırınız.\n6. Hastayı travma tahtasına kemerler vasıtasıyla tespit ediniz."},
  {id:"elastik-bandaj",title:"Elastik Bandaj Uygulama Becerisi",cat:"temel",content:"**ELASTİK BANDAJ UYGULAMA BECERİSİ BASAMAKLARI**\n\nYumuşak doku yaralanmalarında, ödem kontrolü için elastik bandaj uygulaması yapılmaktadır. Kaynaklarda yer alan uygulama basamakları sırasıyla şöyledir:\n\n1. Kullanılacak elastik bandaj tipine karar veriniz (Büyük eklemler ve büyük vücut bölgeleri için geniş bandaj - 15cm - , küçük eklemler ve küçük vücut bölgeleri için dar elastik bandajlar – 8,10 cm – kullanılmalıdır).\n2. Hastaya kendinizi tanıtarak yapılacak işlemin gerekçesi ve uygulanma biçimi hakkında bilgi veriniz ve hastanın onamını alınız.\n3. Bandajın sarılacağı vücut bölgesindeki giysilerini çıkarınız.\n4. Elastik bandaj uygulaması her zaman distalden proksimale doğru yapılmalıdır ve orta gerginlikte (bandajın maksimum gerginliğinin en az %50 gerginliğinde) uygulanmalıdır.\n5. Ayak bileği için parmakların bitiminden başlayınız, başlangıç bölgesinde bandajın gevşememesi ve daha uzun süre etkin kullanımı için 2 kat gergin şekilde sardıktan sonra bir önceki turun yarısını kaplayacak şekilde, orta gerginlikte proksimale doğru ilerleyiniz.\n6. Bitirmeden önce en distalde yaptığımız gibi, proksimalde de 2 kat daha gergin şekilde sarınız (bu işlem, hem bandajın daha sabit kalmasını hem de hasta konforunu sağlayacaktır).\n7. Elastik bandajı tespit ediniz."},
  {id:"iki-kisi-tasima",title:"İlk Yardımda Kazazedenin İki Kişi Tarafından Taşınması Becerisi",cat:"temel",content:"**ELASTİK BANDAJ UYGULAMA BECERİSİ BASAMAKLARI**\n\nYumuşak doku yaralanmalarında, ödem kontrolü için elastik bandaj uygulaması yapılmaktadır. Kaynaklarda yer alan uygulama basamakları sırasıyla şöyledir:\n\n1. Kullanılacak elastik bandaj tipine karar veriniz (Büyük eklemler ve büyük vücut bölgeleri için geniş bandaj - 15cm - , küçük eklemler ve küçük vücut bölgeleri için dar elastik bandajlar – 8,10 cm – kullanılmalıdır).\n2. Hastaya kendinizi tanıtarak yapılacak işlemin gerekçesi ve uygulanma biçimi hakkında bilgi veriniz ve hastanın onamını alınız.\n3. Bandajın sarılacağı vücut bölgesindeki giysilerini çıkarınız.\n4. Elastik bandaj uygulaması her zaman distalden proksimale doğru yapılmalıdır ve orta gerginlikte (bandajın maksimum gerginliğinin en az %50 gerginliğinde) uygulanmalıdır.\n5. Ayak bileği için parmakların bitiminden başlayınız, başlangıç bölgesinde bandajın gevşememesi ve daha uzun süre etkin kullanımı için 2 kat gergin şekilde sardıktan sonra bir önceki turun yarısını kaplayacak şekilde, orta gerginlikte proksimale doğru ilerleyiniz.\n6. Bitirmeden önce en distalde yaptığımız gibi, proksimalde de 2 kat daha gergin şekilde sarınız (bu işlem, hem bandajın daha sabit kalmasını hem de hasta konforunu sağlayacaktır).\n7. Elastik bandajı tespit ediniz."},
  {id:"erkek-foley",title:"Erkek Hastaya Foley Sonda Takma Becerisi",cat:"sonda",content:"**ERKEK HASTAYA FOLEY SONDA TAKMA BECERİSİ BASAMAKLARI**\n1. Hastanın doğru kişi olduğunu kontrol ediniz.\n2. Kendinizi tanıtınız.\n3. Yapılacak işlemi ve gerekçesini kısaca açıklayınız. Hastanın sizi doğru anlayıp anlamadığın kontrol ediniz ve soru sormasına fırsat veriniz.\n4. Hastanın onamını alınız.\n5. Hastayı sırtüstü rahat olacağı şekilde yatırınız ve iç çamaşırı dâhil soyunmasını sağlayınız.\n6. Ellerinizi yıkayınız.\n7. Muayene eldivenlerinizi giyiniz.\n8. Gazlı bezi antiseptik solusyon ile ıslatınız.\n9. Penisi, eksternal üretral açıklıktan başlayarak, genişleyen halkalar biçiminde antiseptik solüsyon ile ıslatılmış gazlı bez ile siliniz (Silme hareketini en az üç kez yineleyiniz).\n10. Foley sondayı steril tekniğe uygun olarak (iç paketin sterilitesini bozmadan) paketini açınız.\n11. Muayene eldivenlerinizi çıkarıp steril eldivenlerinizi giyiniz.\n12. Hastanın üzerine steril delikli örtüyü örtünüz.\n13. Foley sondanın balona giden uçtaki bölümünü sıkarak, balonunu kontrol ediniz.\n14. Sondanın balon hacmini kontrol ederek, enjektörünüze gerekli miktarda SF çekiniz.\n15. Foley sondasının uç kısmını steril vazelin veya jel ile kayganlaştırınız.\n16. Kullandığınız eliniz ile sondanın ucunu yönlendirirken, diğer eliniz ile penisi tutunuz.\n17. Hastaya işleme başlayacağınızı söyleyiniz.\n18. Sondanın ucunu üretradan içeriye yavaşça ilerletiniz.\n19. Sondanın ucu perine düzeyine geldiğinde, hastanın penisini aşağı doğru indirip, vücut eksenine paralel biçime getiriniz ve ilerletmeye devam ediniz.\n20. Sondadan idrar çıkışını izleyiniz ve idrarın böbrek küvete akmasını sağlayınız.\n21. İdrar akımı başladıktan sonra, sondayı 2-3 cm daha ilerletiniz.\n22. Sondanın idrar gelen ucunu sıkıştırarak idrar akışını kısa süreli durdurup idrar torbasını sondaya takınız.\n23. Enjektörünüz ile balona giden yola gerekli miktarda SF veriniz.\n24. Enjektörü ayırınız.\n25. Sondayı geriye doğru yavaşça çekerek, balonun mesane boynuna oturmasını sağlayınız.\n26. Sondayı hafifçe çekerek, balonun sondanın çıkmasına engel olabildiğini kontrol ediniz.\n27. İdrar torbasını mesaneden daha aşağı yerleşecek biçimde askıya alınız.\n28. Örtü ve diğer malzemenizi toplayınız.\n29. Hastaya işlemin bittiğini anlatınız.\n30. Tüm atıkları güvenli biçimde ilgili atık kutularına atınız.\n31. Eldivenlerinizi çıkarınız ve onları da atık kutusuna atınız.\n32. Ellerinizi yıkayınız.\n33. Yapılan işlemi kaydediniz."},
  {id:"kadin-foley",title:"Kadın Hastaya Foley Sonda Takma Becerisi",cat:"sonda",content:"**KADIN HASTAYA FOLEY SONDA TAKMA BECERİ BASAMAKLARI**\n1. Hastanın doğru kişi olduğunu kontrol ediniz.\n2. Kendinizi tanıtınız.\n3. Yapılacak işlemi ve gerekçesini kısaca açıklayınız. Hastanın sizi doğru anlayıp anlamadığın kontrol ediniz ve soru sormasına fırsat veriniz.\n4. Hastanın onamını alınız.\n5. Hastayı sırtüstü rahat olacağı şekilde yatırınız ve iç çamaşırı dâhil soyunmasını sağlayınız.\n6. Ellerinizi yıkayınız.\n7. Muayene eldivenlerinizi giyiniz.\n8. Gazlı bezi antiseptik solusyon ile ıslatınız.\n9. Hastanın bacaklarını dizlerinden büküp, yanlara açmasını sağlayınız.\n10. Perine ve labia majorlerin arasını antiseptik solusyon ile ıslatılmış gaz ile önden, arkaya doğru siliniz (Silme hareketini en az üç kez yineleyiniz).\n11. Foley sondayı steril tekniğe uygun olarak (iç paketin sterilitesini bozmadan) paketini açınız.\n12. Muayene eldivenlerini çıkarıp steril eldivenlerinizi giyiniz.\n13. Hastanın üzerine steril delikli örtüyü örtünüz.\n14. Foley sondanın balona giden uçtaki bölümünü sıkarak, balonunu kontrol ediniz.\n15. Sondanın balon hacmini kontrol ederek, enjektörünüze gerekli miktarda SF çekiniz.\n16. Foley sondasının uç kısmını steril vazelin veya jel ile kayganlaştırınız.\n17. Kullandığınız eliniz ile sondanın ucunu yönlendirirken, diğer elinizin 1. ve 2. parmakları ile labia majorleri aralayınız.\n18. Hastaya işleme başlayacağınızı söyleyiniz.\n19. Üretral orifisi belirleyince, sondanın ucunu üretradan içeriye yavaşça ilerletiniz.\n20. Üretra içinde ilerler iken sondanın yönü vücut uzun eksenine paralel veya en fazla birkaç derecelik açı yapmalıdır.\n21. Sondadan idrar çıkışını izleyiniz ve idrarın böbrek küvete akmasını sağlayınız.\n22. İdrar akımı başladıktan sonra, sondayı en az 4 cm daha ilerletiniz.\n23. Sondanın idrar gelen ucunu sıkıştırarak idrar akışını kısa süreli durdurup idrar torbasını sondaya takınız.\n24. Enjektörünüz ile balona giden yola gerekli miktarda SF veriniz.\n25. Enjektörü ayırınız.\n26. Sondayı geriye doğru yavaşça çekerek, balonun mesane boynuna oturmasını sağlayınız.\n27. Sondayı hafifçe çekerek, balonun sondanın çıkmasına engel olabildiğini kontrol ediniz.\n28. İdrar torbasını mesaneden daha aşağı yerleşecek biçimde askıya alınız.\n29. Örtü ve diğer malzemenizi toplayınız.\n30. Hastaya işlemin bittiğini anlatınız.\n31. Tüm atıkları güvenli biçimde ilgili atık kutularına atınız.\n32. Eldivenlerinizi çıkarınız ve onları da atık kutusuna atınız.\n33. Ellerinizi yıkayınız.\n34. Yapılan işlemi kaydediniz."},
  {id:"foley-cikarma",title:"Foley Sonda Çıkarma Becerisi",cat:"sonda",content:"**FOLEY SONDA ÇIKARMA BECERİSİ BASAMAKLARI** (Kadın ve erkek hasta için)\n1. Hastanın doğru kişi olduğunu kontrol ediniz.\n2. Kendinizi tanıtınız.\n3. Yapılacak işlemi ve gerekçesini kısaca açıklayınız. Hastanın sizi doğru anlayıp anlamadığın kontrol ediniz ve soru sormasına fırsat veriniz.\n4. Hastanın onamını alınız.\n5. Hastayı sırtüstü rahat olacağı şekilde yatırınız ve iç çamaşırı dâhil soyunmasını sağlayınız.\n6. Ellerinizi yıkayınız.\n7. Muayene eldivenlerinizi giyiniz.\n8. Boş ve iğnesiz bir enjektörü balona giden yolun ucuna takarak balonu şişirmek için verilen solüsyonun tamamını geri çekiniz.\n9. Hastanın meatusu üzerine gazlı bez tampon yerleştirerek bir elinizle desteklerken diğer elinizle sondayı çekerek çıkarınız.\n10. Hastaya işlemin bittiğini anlatınız.\n11. Tüm atıkları güvenli biçimde ilgili atık kutularına atınız.\n12. Eldivenlerinizi çıkarınız ve onları da atık kutusuna atınız.\n13. Ellerinizi yıkayınız."},
  {id:"enjekter-acma",title:"Enjektör Açma Becerisi",cat:"sonda",content:"**ENJEKTÖR AÇMA BECERİSİ BASAMAKLARI**\n\n1. **Ellerinizi yıkayınız**, eldiven giyiniz.\n2. Kulanım amacınıza **uygun hacimde bir enjektör** seçiniz.\n3. Enjektörün üstündeki **son kullanma tarihini** ve paketin **yırtık olup olmadığını** kontrol ediniz.\n4. Enjektör paketini **işaretli yerinden** açınız.\n5. Enjektör paketini dışından tutarken, özellikle **içindeki iğne ile birlikte** tutunuz.\n6. Diğer eliniz ile enjektörü **pistonu tarafından** tutup, paketten çıkarınız.\n7. Enjektörün iğne takılacak ucunu **hiç bir yere değdirmeden**, iğnenin arkasına takınız.\n8. İğneyi **kılıfı ile birlikte**, enjektörün ucunda paketten çıkarınız.\n9. İğne ile enjektör **bağlantısını sıkılaştırınız**."},
  {id:"toz-ilac",title:"Toz Halindeki İlacın Çözündürülmesi Becerisi",cat:"sonda",content:"**TOZ HALİNDEKİ İLACIN ÇÖZÜNDÜRÜLMESİ BECERİSİ ÖĞRENİM REHBERİ**\n\nFlakonlar içerisinde toz ya da sıvı ilaç bulunan ağzı metal veya plastik ile sabitlenmiş kauçuk tıpa ile kapatılmış, bunların üzerinde kapağı bulunan küçük cam şişelerdir. Kapak ilk açıldığında ortaya çıkan kauçuk tabaka steril olduğundan, sterilitenin bozulmamasına dikkat edilmelidir. Eğer flakonun daha önceden kapağı açılmışsa kullanmadan önce kauçuk bölgenin dezenfektan solüsyon ile temizlenmesi gerekmektedir. Flakon toz halinde ilaç barındırıyor ise flakonun yanında toz halinde ilacı çözmeye yarayan sıvı çözücü bulunur.\n\n**Amaç:** Toz halindeki ilacın doğru teknikle çözündürülmesi becerisinin kazanılmasıdır.\n**Araç gereç:** Toz halindeki ilaç ve sıvı çözücüsü, antiseptik solüsyon, gazlı bez, ilaç hacmine uygun enjektör, tıbbi atık kutusu, steril olmayan eldiven, delici kesici alet kutusu.\n\n**TOZ HALİNDEKİ İLACIN ÇÖZÜNDÜRÜLMESİ BECERİSİ BASAMAKLARI**\n\n1. Ellerinizi yıkayıp eldiven giyiniz.\n2. Yapılacak işlem için gerekli malzemelerinizi, sterilizasyon durumu ve son kullanma tarihleri açısından kontrol ederek hazırlayınız.\n3. Toz halindeki ilaç ve sıvı çözücünün etiketlerini kontrol ediniz. Ayrıca flakon içerisindeki ilacı tortu, miktar, renk açısından da inceleyiniz.\n\n*(Not: Kaynak metnin bu bölümünde 4, 5, 6, 7 ve 8. basamaklar atlanmış olup liste 9. maddeden devam etmektedir.)*\n\n9. Uygulanacak miktardan (bu uygulama için 1 ml) 0,1 ml fazla çözücüyü enjektöre çekiniz.\n10. Enjektörü şişeden çıkartıp, enjektör iğnesinin kılıfını takınız ve iğnesi yukarıya gelecek biçime getirip, varsa içindeki havayı çıkarınız.\n11. İğnenin koruyucu kılıfını çıkarınız.\n12. Enjektör iğnesini toz ilaç şişesinin lastik kapağından içeriye batırınız.\n13. Enjektörün içindeki çözücüyü şişenin içine boşaltınız.\n14. Enjektörü çıkarmadan, şişeyi içinde partikül kalmayıncaya kadar ilacın çözülme özelliğine uygun olacak şekilde aşağı yukarı veya avuç içinde dairesel hareketlerle çalkalayınız.\n15. Şişeyi sıvı ilaç aşağı gelecek biçimde ters çeviriniz.\n16. Şişenin içindeki ilaçtan gereken miktardan (bu uygulama için 1 ml) 0,1 ml fazlasını enjektöre çekiniz.\n17. Enjektör iğnesini şişeden çıkararak koruyucu kılıfını takınız.\n18. Enjektör içinde hava varsa, enjektör, iğnesi yukarıda olacak şekilde tutulurken, enjektör gövdesine fiske vurarak hava kabarcığının yukarıya toplanmasını sağlayınız.\n19. Enjektörün ucunda hava var ise pistonu yukarı iterek havayı boşaltınız.\n20. İşiniz bitince çevreyi toplayınız, atıkları uygun atık kutularına ayrı ayrı atınız. Eğer flakonda ilaç kalmadıysa veya tekrar kullanılmayacaksa, flakonu ilgili atık kutusuna atmadan önce üzerindeki yazıları yeniden okuyarak, doğru ilacın çekilmiş olduğunu kontrol ediniz.\n21. Eldivenlerinizi çıkarınız, atık kutusuna atınız ve ellerinizi yıkayınız."},
  {id:"im-enjeksiyon",title:"Kalçaya (Dorsogluteal) İntramusküler Enjeksiyon Yapma Becerisi",cat:"sonda",content:"**KALÇAYA (DORSOGLUTEAL BÖLGEYE) İNTRAMUSKÜLER ENJEKSİYON YAPMA BECERİSİ ÖĞRENİM REHBERİ**\n\n**Genel Bilgiler:**\nİntramüsküler enjeksiyonda amaç, ilacı derin kas dokusuna vermektir. Uygulama sonrası, kas dokusunun kanlanması fazla olduğu için ilaç hızla emilerek sistemik dolaşıma geçer. İntramüsküler enjeksiyon yapılacak bölgenin dikkatli belirlenmesi gerekir. Uygulama yapılacak bölge belirlenirken, hastanın yaşı, kas yapısı ve verilecek ilaç miktarı göz önünde bulundurulmalıdır. Travmaya uğramış, kanlanması bozulmuş, apse, kist, dermatit, yanık ve skar dokusu olan bölgeye intramüsküler enjeksiyon yapılmamalıdır. Ayrıca, gluteal kaslar, yürüdükçe geliştiği için üç yaşın altındaki çocuklarda kesinlikle kullanılmamalıdır. Çözündürerek hazırlanan ilacı, İM enjeksiyon ile hastaya uygulamadan önce enjektörün iğnesinin değiştirilmesi gereklidir. Bir defada uygulanacak ilaç miktarı yaşa göre değişmekle birlikte 1,5 – 4 ml arasındadır.\n\n**Beceri Basamakları:**\n*(Not: Kaynak metinde 1-5 ve 15-23. basamaklar eksik olup, mevcut olanlar aynen aktarılmıştır.)*\n\n6. Yapılacak işlem için gerekli malzemelerinizi, sterilizasyon ve son kullanma tarihleri açısından kontrol ederek hazırlayınız.\n7. Hastayı yüzüstü yatırarak enjeksiyon yapılacak bölgeyi açmasını sağlayınız.\n8. Spina iliaca posterior superiordan (kalça kemiğinin iç çıkıntısı) femurun büyük torakanterine bir çizgi hat belirleyiniz. (Bu çizgi siyatik sinire paraleldir ve siyatik sinirin lateralinde kalır).\n9. Enjeksiyonu bu çizilen hattın üst dış kısmına yani krista iliacadan 5-8 cm aşağıda bulunan alana yapacak şekilde belirleyiniz.\n10. Enjeksiyon yapmak için belirlenen bölgeyi antiseptik solüsyonla içten dışa dairesel şekilde yaklaşık 5 cm çapında siliniz.\n11. Hastaya kendisini sıkmaması, gevşek bırakması gerektiğini anlatınız.\n12. İğnenin koruyucu kılıfını çıkarınız.\n13. Pasif elin baş ve orta parmaklarıyla belirlenen bölgenin derisini gergin tutunuz.\n14. Enjektörü aktif elinizde kalem tutar gibi cilde dik açı (90 derece) yapacak şekilde *(Cümle kaynak metinde burada kesilmektedir)*.\n...\n24. Yapılan işlemi kaydediniz."},
  {id:"ampul-ilac",title:"Ampulden Enjektöre İlaç Çekme Becerisi",cat:"sonda",content:"**AMPULDEN ENJEKTÖRE İLAÇ ÇEKME BECERİSİ BASAMAKLARI**\n\n1. Ellerinizi yıkayıp eldiven giyiniz.\n2. Yapılacak işlem için gerekli malzemelerinizi, sterilizasyon ve son kullanma tarihleri açısından kontrol ederek hazırlayınız.\n3. Enjekte edilecek ampulün isim ve içeriğini kontrol ederek enjekte edilmek istenilen ilaç olduğundan emin olunuz.\n4. Ampul formundaki ilaç çözeltisini tortu, bulanıklık yönünden inceleyiniz.\n5. Ampule parmakla fiske vurarak ampulün boyun kısmında sıvı (ilaç) kalmamasını sağlayınız.\n6. Eğer ampulün boynunu çepeçevre dolanan bir çizgi veya nokta varsa, testere kullanmadan kırılabileceği anlaşılır. Ampulü bu yönden inceleyiniz.\n7. Ampulün taban/gövde kısmı pasif elde, kırılarak atılacak tepe kısmı aktif elde kalacak şekilde her iki elin işaret ve başparmakları ile elinizde gazlı bez olacak şekilde ampulü tutunuz.\n8. Tutuş işlemi yapıldıktan sonra ampulün gövdesini sabit tutunuz ve aktif el ile arkaya doğru kuvvet uygulayarak ampulün tepesini kırınız.\n9. Ampulün gövde kısmını pasif elin işaret ve orta parmakları arasında tutunuz.\n10. Enjektörü; iğnenin ucundaki koruyucu kılıfı düşürmeden aktif elinize alınız.\n11. Pasif elin baş ve yüzük parmağı ile enjektörün iğnesinin koruyucu kılıfını çıkarınız.\n12. Aktif elle kontrol edilen enjektörün iğnesi başka bir yere değdirilmeden ampul içine sokulurken, enjektörün iğneye yakın ucu pasif elin baş ve yüzük parmakları ile kontrol edilerek kayması ve bir yere değerek kirlenmesi önlenmelidir.\n13. Enjektörün pistonunu aktif elin başparmağı ve orta parmağı ile çekerken işaret parmağı ile enjektör tabanını iterek ampul içindeki ilacı tamamen çekiniz.\n14. Boşalan ampulü ilgili atık kutusuna atmadan önce üzerindeki yazıları yeniden okuyarak, doğru ilacın çekilmiş olduğunu kontrol ediniz.\n15. Enjektör iğnesinin kılıfını takınız.\n16. Enjektör içinde hava varsa, enjektör iğnesi yukarıda olacak şekilde tutulurken enjektör gövdesine fiske vurarak hava kabarcığının yukarıya toplanmasını sağlayınız.\n17. Enjektörün ucunda hava var ise pistonu yukarı iterek havayı boşaltınız.\n18. Tüm atıkları güvenli biçimde ilgili atık kutularına atınız.\n19. Eldivenlerinizi çıkarınız, atık kutusuna atınız ve ellerinizi yıkayınız."},
  {id:"iv-enjeksiyon",title:"İntravenöz Enjeksiyon Yapma Becerisi",cat:"sonda",content:"**İNTRAVENÖZ ENJEKSİYON YAPMA BECERİSİ ÖĞRENİM REHBERİ**\n\nİntravenöz uygulama, **ilaç içeren sıvının doğrudan damar içine verilmesidir** ve bir ilacın direkt olarak **en hızlı uygulanma yoludur**. Bu uygulamanın mümkün olduğu kadar yavaş ve hastanın reaksiyonu gözetilerek yapılması gerekir.\n\nIV girişim için kullanılan kol venleri, v. basilica ve v. sefalicadır. Özellikle antecubital fossada bulunan median bazilik ve sefalik venler ve el bileği bölgesinden geçen dalları uygulama için tercih edilmektedir. El sırtında V. sefalica ve basilicanın el sırtındaki dalları ile dorsal metakarpal venler kullanılır.\n\n**Uygulama İçin Bölge Seçiminde Dikkat Edilecek Noktalar:**\n*   Ven seçiminde uygulama proksimalden distale doğru olmalıdır.\n*   Travmaya uğramış,\n*   Dolaşım bozukluğu,\n*   Ödem olan bölgeden,\n*   Mastektomi yapılan taraftan ve\n*   Arteriovenöz fistül olan koldan enjeksiyon yapılmamalıdır.\n\n*(Not: Yukarıda verilen IV uygulama bölgeleri ve bölge seçiminde dikkat edilecek noktalar, venöz kan alma ve IV kanül uygulaması için de geçerlidir.)*\n\n**İNTRAVENÖZ ENJEKSİYON YAPMA BECERİSİ BASAMAKLARI**\n\n**Amaç:** Doğru teknikle intravenöz enjeksiyon yapma becerisinin kazanılmasıdır.\n**Araç gereç:** Uygulaması yapılacak olan ilaç, steril olmayan eldiven, çekilecek ilaç hacmine uygun steril enjektör, turnike, pamuk, antiseptik solüsyon, tıbbi atık kutusu, delici kesici atık kutusu.\n\n*(Not: Kaynak metinde 6-10 arası basamaklar yer almadığından mevcut olan basamaklar sırasıyla ve değiştirilmeden aşağıya aktarılmıştır.)*\n\n1. Hastanın doğru kişi olduğunu kontrol ediniz.\n2. Kendinizi tanıtınız.\n3. Yapılacak işlemi ve gerekçesini kısaca açıklayınız. Hastanın sizi doğru anlayıp anlamadığın kontrol ediniz ve soru sormasına fırsat veriniz.\n4. Hastanın onamını alınız.\n5. Ellerinizi yıkayıp eldiven giyiniz.\n11. İlaç uygulaması yapacağınız ven üzerindeki deriyi tek yönde antiseptik madde içeren tampon ile aşağıdan yukarıya doğru ya da dairesel olarak siliniz.\n12. Enjektör iğnesinin kılıfını çıkarınız.\n13. Enjektörü tutmadığınız el ile vene gireceğiniz noktanın birkaç cm. distalinden, deriyi distale doğru çekiniz. Böylece venin kayması önlenir.\n14. Enjektörün iğnesinin keskin yüzünü yukarı doğru tutarak vene girmek istediğiniz bölgenin yaklaşık 0.5cm-1cm altından deriye 30–45 derecelik bir açıyla giriniz.\n15. Deriyi geçince, enjektörün iğnesini deriye paralel 3–5 mm ilerletip, 15 derecelik açıyla vene giriniz.\n16. Enjektör ve iğneyi hiç oynatmadan tutunuz.\n17. Enjektör bulunan elinizi oynatmadan serbest kalan elinizle enjektörün piston kısmını hafifçe geri çekerek kan gelip gelmediğini kontrol ediniz. Kan geliyorsa iğneniz vene girmiştir.\n18. Eğer kan gelmiyorsa pasif elle turnikeyi açarak enjektör iğnesini yavaşça aynı açıyla geri çekiniz. Bölgeye kuru pamuk uygulayınız. İşlemi farklı bir ven seçerek aynı zamanda enjektör iğnesini değiştirerek 7. basamaktan itibaren tekrarlayınız.\n19. Turnikeyi gevşetiniz/ çözünüz.\n20. Yavaş olarak enjeksiyonu yapınız.\n21. Enjeksiyon sırasında ağrı, ödem ve hematom gelişip, gelişmediğini izleyiniz. Eğer kuşkulanırsanız, iğnenin ven içinde olup olmadığını, hafif bir aspirasyon yaparak yeniden kontrol ediniz.\n22. Enjeksiyon sonrası kuru pamuk veya tamponu vene girilen noktaya koyunuz.\n23. Enjektör iğnesini yavaşça aynı açıyla geri çekiniz.\n24. İğneyi geri çekince bölgeye bası uygulayınız.\n25. Hastaya enjeksiyonu yaptığınızı, bir süre damara girilen yere basmasının yararlı olacağını söyleyiniz.\n26. Bir süre hastanın reaksiyonlarını gözleyiniz.\n27. Tüm atıkları güvenli biçimde ilgili atık kutularına atınız.\n28. Eldivenlerinizi çıkarınız, atık kutusuna atınız ve ellerinizi yıkayınız.\n29. Yapılan işlemi kaydediniz."},
  {id:"iv-kanul",title:"İntravenöz Kanül Uygulama Becerisi",cat:"sonda",content:"**İNTRAVENÖZ KANÜL UYGULAMA BECERİSİ ÖĞRENİM REHBERİ**\n\nBu beceride, İV kanül steril şartlarda ven içine yerleştirilir. Uygulama yaparken, **alt ekstremitedeki venler emboli ve trombofilebit riski sebebiyle tercih edilmemekte, genellikle kol venleri tercih edilmektedir**.\n\n**Klinik Endikasyonları:**\n* Ven içine ilaç uygulaması,\n* Sıvı elektrolit kayıplarının yerine konması amacıyla sıvı uygulaması,\n* Kan ve kan ürünleri transfüzyonu,\n* Oral alamayan hastalarda parenteral beslenme amacıyla damar yolu açılır.\n\n**İntraket (Branül/ Kanül) Özellikleri:**\nSteril paket içinde uygulamaya hazır tek kullanımlık tıbbi malzemedir. Damar girişini gözlemlemeyi sağlayan kılavuz iğne, esnek ve özel olarak şekillendirilmiş bir kanül ve hasta vücuduna sabitlemek için kelebek şeklinde kanatlardan oluşmaktadır. İntraket vene yerleştirilirken damar içine girildiğinde kılavuz iğnesi çıkarılır ve esnek kateter kanülü damar içinde kalır. **İntraketlerin numarası büyüdükçe çapları küçülür**. \n*İntraket Numaraları (Kalından inceye):* Beyaz 14, Gri 16, Yeşil 18, Pembe 20, Mavi 22, Sarı 24 (pediatrik).\n\n**İNTRAVENÖZ KANÜL UYGULAMA BECERİSİ BASAMAKLARI**\n*(Not: Kaynak metinde 1-6 arası basamaklar yer almadığından 7. basamaktan başlanmıştır.)*\n\n7. Kanülü tespit etmek için kullanacağınız flasteri hazırlayınız.\n8. Eldiven giyiniz.\n9. Damara girilecek kolu açınız.\n10. Turnikeyi girmek istediğiniz bölgenin 5-12cm. üstünden bağlayınız. Turnikenin 2 dakikadan daha uzun süre bağlı kalmamasına dikkat ediniz.\n11. Hastanın elini yumruk yapıp gevşetmesini sağlayarak venlerin dolgunlaşmasını bekleyiniz.\n12. Kanül uygulayacağınız damarı parmak uçlarınızla palpe ediniz.\n13. İV kanül uygulanacak venin üzerindeki deriyi, tek yönde antiseptik madde içeren tampon ile aşağıdan yukarıya doğru ya da dairesel olarak siliniz.\n14. Kanülü kontamine etmeden kapağını çıkarınız.\n15. Pasif elin başparmağı ile damara girilecek alanın biraz altından deriyi aşağı doğru çekerek, deriyi gerdiriniz.\n16. İV kanül iğnesinin açık ağzı yukarıya bakacak şekilde, girilecek venin 0,5 –1 cm altından, önce vene parelel olarak 30 – 45 derecelik açı ile giriniz.\n17. Deriyi geçince, İV kanülü deriye parelel olarak 3 – 5mm ilerletip, 15 derecelik açı ile vene giriniz.\n18. İV kanülü ven içinde 2 – 3mm ilerlettikten sonra kan gelip gelmediğini kontrol etmek için mandreni hafifçe geri çekiniz.\n19. Eğer kanül içine kan gelmediyse vende olmadığınız anlaşılır. Bu durumda turnikeyi açarak kanülün iğnesini aynı açıyla geri çekiniz. Uygulama yaptığınız bölgenin üstüne kuru pamuk ile basınç uygulayınız. Daha sonra yeni bir kanülle işlemleri 9. basamaktan itibaren tekrar ediniz.\n20. Kanüle kan geldiyse İV kanülün mandrenini kanül içerisinde geriye doğru kısmen çekerek poliüretan kanülün ven içinde ilerlemesini sağlayınız.\n21. Turnikeyi çözünüz.\n22. İV kanülü yerleştirdikten sonra flasterle tespit ediniz.\n23. Sıvı uygulaması yapılacaksa serum seti ile bağlantı yapınız, yapılmayacaksa mandreni çıkarıp İV kanülün kapağını kapatınız. (İV kanülün ucunun açıldığı dönemlerde, başparmağınız ile ilgili vene basarak, geri kan akımını engellemeyi unutmayınız.).\n24. Flasterin üzerine işlem tarihini, saatini ve isminizi not ediniz.\n25. Hastaya işlemin bittiğini ve İV kanülün maksimum 72 saat kalabileceğini söyleyiniz.\n26. Tüm atıkları güvenli biçimde ilgili atık kutularına atınız.\n27. Eldivenlerinizi çıkarınız, atık kutusuna atınız ve ellerinizi yıkayınız.\n28. Yapılan işlemi kaydediniz."},
  {id:"vacutainer",title:"Vacutainer ile Venden Kan Örneği Alma Becerisi",cat:"sonda",content:"**VACUTAİNER İLE VENDEN KAN ÖRNEĞİ ALMA BECERİSİ ÖĞRENİM REHBERİ**\n\nLaboratuar tanı testlerinin önemli bir bölümü hastadan alınan venöz kan örneği ile gerçekleştirilir. Alınan kan örneğinin kendisinde, ya da plazması ayrılarak testler gerçekleştirilir. Venden kan örneği almak için enjektör veya vacutainer kullanılır. Bu uygulamada, vacutainerla venden kan örneği alma becerisi anlatılacaktır.\n\n**Klinik Endikasyonlar:**\n* Hastalıkların teşhis edilmesi\n* Tedavi sürecinin izlenmesi\n\n**Amaç:** Vacutainer ile venden kan örneği alma becerisinin kazandırılmasıdır.\n**Araç gereç:** Pamuk, antiseptik solüsyon, steril olmayan eldiven, turnike, vacutainer, vacutainer ucuna uygun iğne, kan tüpleri, tıbbi atık kutusu, delici kesici atık kutusu.\n\n**VACUTAİNER İLE VENDEN KAN ÖRNEĞİ ALMA BECERİSİ BASAMAKLARI**\n\n1. Hastanın doğru kişi olduğunu kontrol ediniz.\n2. Kendinizi tanıtınız.\n3. Yapılacak işlemi ve gerekçesini kısaca açıklayınız. Hastanın sizi doğru anlayıp anlamadığın kontrol ediniz ve soru sormasına fırsat veriniz.\n4. Hastanın onamını alınız.\n5. Ellerinizi yıkayıp eldiven giyiniz.\n6. Yapılacak işlem için gerekli malzemelerinizi, sterilizasyon ve son kullanma tarihleri açısından kontrol ederek hazırlayınız.\n7. Kan örneği alınacak kolu açınız.\n8. Antekubital (dirsek ön çukuru) veya el sırtı bölgesini inceleyerek yeterince belirgin bir veni seçiniz.\n9. Kullanılacak venin altından kola destek yapınız.\n10. Steril iğnenin vidalı tarafındaki şeffaf koruyucu kılıfı çıkarınız ve iğnenin vidalı kısmını vacutainera vidalayarak takınız.\n11. Dirseğin 8–10 cm yukarısından turnikeyi bağlayınız. Turnikenin 2 dakikadan daha uzun süre bağlı kalmamasına dikkat ediniz.\n12. Hastanın elini yumruk yapıp gevşetmesini sağlayarak, venlerin dolgunlaşması için bekleyiniz.\n13. Kan örneği alacağınız ven üzerindeki deriyi tek yönde antiseptik madde içeren tampon ile aşağıdan yukarıya doğru ya da dairesel olarak siliniz.\n14. Üzerine iğne takılmış vacutaineri aktif olarak kullandığınız ele alınız ve iğnenin koruyucu bölümünü çıkarınız.\n15. Vacutainer tutmadığınız el ile vene gireceğiniz noktanın birkaç cm. distalinden, deriyi distale doğru çekiniz.\n16. Vacutainerin iğnesini, keskin uç deriye yakın gelecek biçimde, deriye 35 derecelik bir eğimle batırınız.\n17. Deriyi geçince, iğneyi deriye paralel 3–5 mm ilerletip, vene giriniz.\n18. Vene girdiğinizi hissettikten sonra iğnenin ucunu ven içinde 2–3 mm ilerletiniz.\n19. Vacutaineri aktif olarak kullanılmayan elin işaret ve başparmağı ile iğnenin vacutainere girdiği kısımla hasta kolu arasıda sabitleştiriniz.\n20. Kan alma tüpünü, aktif olarak kullanılan elin işaret ve orta parmağı vacutainerin tutma yerindeyken, başparmak ile, enjeksiyon yapıyormuş gibi ilerleterek vacutainere sokunuz.\n21. Eğer kan gelmiyorsa, iğneyi vacutainerin yönünü değiştirmeden damardan çıkarınız ve damara giriş yeri üzerine kuru pamuk bastırın. Vacutainerdaki iğneyi, döndürerek çıkarınız ve kesici-delici atık kutusuna atınız ve 7. basamaktan itibaren işlemi tekrar ediniz.\n22. Kan alma tüpü kanla dolduğunda, aktif olarak kullanılan elin başparmağı ile vacutainerin tutma yerine karşı basınç uygularken, dolu kan alma tüpünü vacutainerden geri çekiniz.\n23. Bir başka tüpe kan almak için 20–22. basamağı tekrar ediniz.\n24. Kan örneğini alınca turnikeyi çözünüz.\n25. İğneyi vacutainerin yönünü değiştirmeden damardan çıkarınız ve damarın giriş yeri üzerine kuru pamuk basınız.\n26. Kanı alınan kişiye, pamuk üzerine 2–3 dakika parmağıyla bastırmasını söyleyiniz.\n27. Tüm atıkları güvenli biçimde ilgili atık kutularına atınız.\n28. Eldivenlerinizi çıkarınız, atık kutusuna atınız ve ellerinizi yıkayınız."},
  {id:"portegu-dugum",title:"Portegü ile Düğüm Atma Becerisi",cat:"cerrahi",content:"**PORTEGÜ İLE DÜĞÜM ATMA BECERİSİ BASAMAKLARI**\n\n1. İpliği bağlayacağınız kalemin altına, bir tarafta 2-3 cm kalacak biçimde yerleştiriniz.\n2. Uzun kalan taraftan serbest eliniz ile ipliği tutunuz.\n3. İpliği, portegü ipin üstünde olacak şekilde diğer elinizdeki portegünüzün ucuna bir kez dolayınız.\n4. Portegünüz ile, diğer taraftaki serbest ucu yakalayınız.\n5. Doladığınız ipi karşı tarafa çekerken, portegünüzün ucundaki ipi uzun ip tarafına çekiniz.\n6. Kalemin çevresinde boşluk kalmayana dek düğümü sıkıştırınız.\n7. Düğüm oturunca, portegünüzü gevşetip, ipin ucunu serbest bırakınız.\n8. Bu kez, elinizdeki ipi, portegünün çevresine son kez yaptığınızın tersi yönden bir kez dolayınız.\n9. Portegünün ucu ile ipliğin serbest ucunu tutunuz.\n10. Bu kez elinizdeki ipi ve portegünüzün ucundaki ipi, bir öncekinin tersi yönlere çekiniz.\n11. Düğümü bir öncekinin üstüne oturtunuz.\n12. Basamakları tekrarlayıp, üçüncü düğümü de oturtunuz.\n13. Makas ile, düğümden sonra 1 cm iplik kalacak biçimde her iki ipi kesiniz."},
  {id:"lokal-anestezi",title:"Lokal Anestezi Yapma ve Sütür Atma Becerisi",cat:"cerrahi",content:"**LOKAL ANESTEZİ YAPMA ve SÜTÜR ATMA BECERİSİ BASAMAKLARI**\n\n1. Hastanın doğru kişi olduğunu kontrol ediniz.\n2. Kendinizi tanıtınız.\n3. Yapılacak işlemi ve gerekçesini kısaca açıklayınız. Hastanın sizi doğru anlayıp anlamadığın kontrol ediniz ve soru sormasına fırsat veriniz.\n4. Hastanın onamını alınız.\n5. Ellerinizi yıkayınız.\n6. Eldiven giyiniz.\n7. Cilt kesisinin olduğu yeri inceleyiniz (damar, sinir, kemik, tendon ve fasya hasarının olmadığını tespit ediniz), yabancı cisimleri temizleyiniz ve SF ile yıkayınız.\n8. Dikiş setinin üzerinde sterildir işaretinin olup olmadığını ve tarihini kontrol ettikten sonra steril sütür atma setini hasta başına getiriniz, uygun bir yerde içindeki malzemeye dokunmadan üst örtülerini açınız.\n9. Açtığınız steril sütür setinin içine steril olarak bir adet 5 mL enjektör açınız.\n10. Açtığınız steril sütür setinin içine steril olarak bir adet uygun büyüklükte sutür materyali açınız.\n11. Tekniğine uygun olarak steril şekilde steril eldiven giyiniz.\n12. Steril sütür atma setindeki tasın içine bir miktar antiseptik solüsyon (genellikle Batikon) konmasını sağlayınız.\n13. Steril sütür atma setinde pensle bir adet gazlı bez yerleştirilerek tasın içine daldırınız ve batikon emdiriniz.\n14. Batikon emdirdiğiniz gazlı bezle yara ve çevresini merkezden dışa doğru dairesel hareketle siliniz (aynı tamponla temizlenen alandan tekrar geçilmeden).\n15. Ortası delik steril örtüyü delik kısmı yaraya gelecek şekilde yerleştiriniz.\n16. 5 ml enjektör içine lokal anestezik solüsyonunun (ağzını, yardımcı tarafından batikonla silinmesini sağlayarak, tekniğine uygun ve steril olarak) çekiniz.\n17. Hastaya uygulamaya başlanacağını söyleyiniz.\n18. Lokal anestezik içeren enjektör ile yara kenarlarına cilt altına olmak kaydıyla lokal anestezik madde enjekte ediniz. Enjeksiyon esnasında sürekli aspirasyon yapılarak damar içi uygulamadan kaçınınız.\n19. Lokal anestezik uygulandıktan en az 3 dakika bekledikten sonra yara kenarına penset ile tutma vasıtası ile ağrılı uyaran uygulayınız ve yeterli anestezi oluştuğunu teyit ediniz.\n20. Portegü ile iğneyi, ipe yakın olacak şekilde, 1/3’lük kısmından tutunuz.\n21. Penseti sol elinize alınız.\n22. Kesik kenarın yaklaşık 0,1-0,5 cm uzağından iğneyi geçeceğiniz noktayı belirleyiniz.\n23. İğneyi, deriye dik açı oluşturacak biçimde belirlediğiniz noktadan, deri altına doğru ilerletiniz.\n24. İğne ucu dermisi geçince, ucunu kesik alana doğru yönlendiriniz.\n25. İğnenizin ucunu penset ile tutunuz.\n26. Portegüyü gevşetip, iğneyi bırakınız.\n27. Penset ile tutuğunuz uç bölümünün olabildiğince distalinden (ancak kesinlikle ucundan değil), iğneyi portegü ile tutunuz.\n28. Bileğinizi iğnenin eğriliğine paralel döndürerek, iğneyi çekiniz.\n29. Yara dudağından kurtulan iğnenizi, pensetiniz ile tutarak, 1 nolu basamaktaki gibi, portegü ile tutunuz.\n30. Karşı yara dudağında, bir önceki dudakta ipliğinizin çıktığı derinliği belirleyiniz.\n31. İğnenizi belirlediğiniz noktadan, deri altına dik olarak ilerletiniz.\n32. İğneyi eğriliğine paralel karşı taraftakine eşit miktarda ilerletiniz.\n33. Deri yüzeyine dik olacak biçimde, dışarı çıkartınız.\n34. İğnenin çıktuğı noktanın yanlarına pensetinizin ayaklarını yerleştiriniz.\n35. Pensetiniz ile deriyi geri iterken, iğnenizi dışarı çıkarmaya devam ediniz.\n36. İğnenizi penset ile tutunuz.\n37. Portegüyü açıp, iğneyi serbest bırakınız.\n38. Derinin dışından iğnenizi portegü ile tutunuz.\n39. Portegüyü iğne eğimine paralel döndürerek, iğneyi deriden çıkarınız.\n40. Dikişe başladığınız noktada, dışarıda 2-3 cm iplik kalana dek iğneyi çekiniz.\n41. İğneniyi portegünden bırakınız.\n42. Pensetinizi bırakınız.\n43. İğnenin arkasından ipliği tutarak, portegünüz ile düğüm oluşturunuz.\n44. Oturmakta olan düğümü olabildiğince yara dudaklarından uzaklaştırınız.\n45. Düğümün, ipliğin deriye girdiği noktaya oturmasını sağlayınız.\n46. Kesi alanı biraz kabarana dek düğümü sıkıştırınız.\n47. Düğüm oturunca, portegünüzü gevşetip, ipin ucunu serbest bırakınız.\n48. İki kez daha düğüm yaparak, cerrahi düğümü tamamlayınız.\n49. Makas ile düğümden sonra yaklaşık 1 cm iplik kalacak biçimde her iki ipi kesiniz.\n50. İşiniz bitince çevreyi toplayınız, atıkları uygun atık kutularına ayrı ayrı atınız.\n51. Eldivenlerinizi çıkarıp uygun atık kutusuna attıktan sonra kalın iş tipi eldiven giyiniz.\n52. Kullanmış olduğunuz malzemelerden dekontaminasyona uygun olanları uygun büyüklükteki dekontaminasyon kabına tamamen bütün yüzeyleri solüsyon (bir ölçek çamaşır suyu, dokuz ölçek su) ile temas edecek şekilde yerleştiriniz.\n53. 10 dakika bekleyiniz.\n54. Dekontamine edilen materyali bol su ile durulayınız.\n55. Araç gereciniz yıkama işlemi öncesi güvenli hale gelmiştir. Bu aşamadan sonra YIKAMA+YÜKSEK DÜZEYDE DEZENFEKSİYON VEYA STERİLİZASYON aşamasına geçebilirsiniz."},
  {id:"pansuman",title:"Deri Yaralanmalarında Pansuman Yapma Becerisi",cat:"cerrahi",content:"**DERİ YARALANMALARINDA PANSUMAN YAPMA BECERİSİ BASAMAKLARI**\n\n1. Hastanın doğru kişi olduğunu kontrol ediniz.\n2. Kendinizi tanıtınız.\n3. Yapılacak işlemi ve gerekçesini kısaca açıklayınız. Hastanın sizi doğru anlayıp anlamadığın kontrol ediniz ve soru sormasına fırsat veriniz.\n4. Hastanın onamını alınız.\n5. Pansuman ve yaranın kapatılması için gereken serum fizyolojik, pansuman seti vb. malzemeyi hazırlayınız.\n6. Ellerinizi yıkayınız.\n7. Eldiven giyiniz.\n8. Serum fizyolojik poşetinin serum seti takılacak tüp kısmını bir makasla kesiniz.\n9. Kestiğiniz tüp kısmını dıştan iki parmağınız arasında bastırarak sıkıştırınız.\n10. Serum fizyolojik poşetini ters çeviriniz.\n11. Poşetin kestiğiniz ucunu yaralanma alanına doğru yönlendiriniz.\n12. Kesik ucunu yaraya dokundurmadan 5 cm uzakta tutunuz.\n13. Parmaklarınızı gevşetip, yaraya serum fizyolojik akmasını sağlayınız.\n14. Poşetin ucunu yara üzerinde gezdirerek her alanın yıkanmasını sağlayınız.\n15. Serum fizyolojik bitince yıkama işlemine son veriniz.\n16. Pansuman setinin üzerindeki otoklav bandını inceleyiniz.\n17. Otoklav bandında siyah verev çizgiler oluşmuşsa seti sadece dışına dokunarak açınız.\n18. Steril eldivenlerinizi giyiniz.\n19. Setin içindeki pensi sağ elinize alınız ve pensi birinci ve dördüncü parmaklarınızın son falanksları ile tutunuz.\n20. Setin içindeki penseti sol elinize alın ve pensetinizi kalem şeklinde tutunuz.\n21. Setin içindeki cepte yer alan bir tamponu penset ile tutunuz.\n22. Penset ile tutmaya devam ederek tamponu cepten çıkarınız.\n23. Tamponu penset ile tutarak ve pensi kullanarak pansuman seti içinde ikiye katlayınız.\n24. Tamponu diğer eksen üzerinden bir kez daha katlayınız.\n25. Penset ile tutmaya devam ederken sağ eldeki pens ile tamponu katlantıların kesişme noktasından sıkıca yakalayınız.\n26. Pensi kitleyin ve tamponun katlantıları yukarı gelecek şekilde tutunuz.\n27. Yardımcınıza tampona değdirmeden antiseptik solüsyon dökmesini söyleyiniz.\n28. Tampon ıslanınca işleme son verdiriniz.\n29. Islak tampon ile yaranın içine dokunmadan çevresini dairesel hareketle boyayınız.\n30. Dairesel hareketlerle içten dışa doğru yara çevresini boyayınız.\n31. Tamponu atınız.\n32. Penset ile bir tampon daha alınız ve pens yardımı ile açınız.\n33. Tamponu yara yerinin üzerine örtünüz.\n34. Aynı şekilde bir tampon daha örtünüz.\n35. Tampondan %50 daha uzun 1 cm genişliğinde bir flaster kesiniz.\n36. Tamponun bir yarısını flaster ile deriye tespit ediniz.\n37. Tamponun diğer yarısını aynı boyutlarda 2. bir flaster parçası ile tespit ediniz.\n38. Atıkları ilgili atık kutusuna atınız.\n39. Ellerinizi yıkayınız.\n40. Hastaya bilgi veriniz."},
  {id:"sutur-alma",title:"Sütür Alma Becerisi",cat:"cerrahi",content:"\"DÖNEM 123 MESLEKSEL.pdf\" dokümanında yer alan **Sütür Alma Becerisi Basamakları** şu şekildedir:\n\n* **1.** Hastanın doğru kişi olduğunu kontrol ediniz.\n\n\n* **2.** Kendinizi tanıtınız.\n\n\n* **3.** Yapılacak işlemi ve gerekçesini kısaca açıklayınız. Hastanın sizi doğru anlayıp anlamadığını kontrol ediniz ve soru sormasına fırsat veriniz.\n\n\n* **4.** Hastanın onamını alınız.\n\n\n* **5.** Ellerinizi yıkayınız.\n\n\n* **6.** Eldiven giyiniz.\n\n\n* **7.** Hastaya uygun pozisyon veriniz.\n\n\n* **8.** Yara üzerindeki pansumanı çıkarınız.\n\n\n* **9.** Yara yüzeyini antiseptik madde ile siliniz.\n\n\n* **10.** Alınacak dikişi pens ya da penset ile tutularak derinin içinde gömülü olan kısmını görünür hale getirebilmek için hafifçe çekiniz.\n\n\n* **11.** Çekme hareketi ile dışarı çıkardığınız kısmı bistüri ucu ya da makasla kesiniz.\n\n\n* **12.** Pensetle tutulan dikişi yukarı ve dışa doğru çekerek çıkartınız.\n\n\n* **13.** Dikiş alma işlemi bittikten sonra yarayı antiseptik madde ile yeniden temizleyiniz.\n\n\n* **14.** Kullanılan malzemelerin uygun şekilde toplayınız.\n\n\n* **15.** Ellerinizi yıkayınız."},
  {id:"aydinlatilmis-onam",title:"Aydınlatılmış Onam Alma Becerisi",cat:"iletisim",content:"**AYDINLATILMIŞ ONAM (RIZA) ALMA BECERİSİ BASAMAKLARI**\n\n1. Hastayı karşılayıp gerekli ortamı sağlayınız. (El sıkma, mahremiyetin korunması, göz temasının sağlanması, hastaya daha önceki görüşmenin hekim tarafından hatırlandığı iletisinin gönderilmesi).\n2. Kendinizi hastaya tanıtınız. (Adı ve soyadı, unvanı).\n3. Yapılacak işlemi anlaşılır bir dille anlatınız. Teknik bir dil kullanmayınız.\n4. Yapılacak işlemin gerekçesini anlaşılır bir dille açıklayınız.\n5. Öngörülen yararı, beklentiyi anlaşılır bir dille açıklayınız. Rızayı zorlayıcı yönde yanlış beklenti yaratmayınız.\n6. Varsa risk ve tehlikeleri anlaşılır bir dille anlatınız. Rızayı zorlayıcı yönde riskleri olduğundan hafif göstermeyiniz.\n7. Başka seçenek olup olmadığını anlaşılır bir dille anlatınız.\n8. Anlaşılır olup olmadığını sorunuz. Eğer gerek görürseniz, bir eksiklik olmaması için kendi sözcükleriyle tekrarlamasını isteyiniz.\n9. Hastanın anlatımını dikkatle/etkin dinleyiniz.\n10. Sormak istedikleri olup olmadığını sorunuz.\n11. Sorularına uygun yanıtlar veriniz.\n12. Rızası olup olmadığını sorunuz.\n13. Hastanın düşünmek için zaman istemesi durumunda sonraki adımları uygun biçimde planlayıp hasta ile paylaşınız.\n14. Tüm aşamalarda hastaya uygunsuz biçimde yönlendirici davranmayınız. Gönüllülüğü koruyunuz."},
  {id:"tam-anamnez",title:"Tam Anamnez Alma Becerisi",cat:"iletisim",content:"**TAM ANAMNEZ ALMA BECERİSİ BASAMAKLARI**\n\n**1 Hastayı Karşılama**\n\n* Hastayı ayağa kalkarak nazikçe karşılayınız ve oturacak yer gösteriniz.\n* Hastaya kendinizi ve ortamda bulunan diğer kişileri tanıtınız.\n* Isınma konuşması yapınız.\n* Yapacağınız görüşme hakkında bilgi veriniz.\n* Hastanın adını soyadını öğreniniz.\n* Hasta ile ilgili kimlik bilgilerini, muayene tarih ve saatini kaydediniz.\n* Adı soyadı\n* Yaşı, cinsiyeti\n* Medeni hali\n* Eğitimi, yaşadığı yer\n* Mesleği\n* Öykünün kimden alındığı\n\n**2 Yakınması ve Öyküsü**\n\n* Açık uçlu sorular ile başvuru neden/lerini öğreniniz.\n* Ana yakınmasını saptayınız ve hastanın ifadesiyle kaydediniz.\n* Ana yakınma ile ilgili öykü alınız ve kaydediniz (Mutlaka kronolojik sırada olacak).\n* Ne zaman başladı?\n* Nasıl başladı? (Başlatan faktörler var mı? Öğreniniz)\n* Özellikleri neler?\n* Semptomun ortaya çıkışı herhangi bir zamanla/durumla ilişkili mi? (Yıl/ay/gündüz/gece)\n* Şiddeti nasıl?\n* Karakteri nasıl? (ağrının özelliği gibi)\n* Yerleşimi nasıl? (ağrı vb. semptomlar için)\n* Nerelere yayılıyor? (ağrı vb. semptomlar için)\n* Artıran etkenler neler?\n* Yatıştıran etkenler neler?\n* Eş zamanlı çıkan diğer semptomlar neler?\n* Daha önce bu sebeple doktora gitmiş mi, aldığı tedaviler ve bunlara alınan yanıt nasıl?\n* Ana yakınması ile ilişkili sistem sorgulaması yapınız.\n* Hastalığın hastaya ve çevresine etkilerini sorgulayınız ve kaydediniz.\n\n**3 Öz Geçmişi**\n\n* Geçirdiği ve halen süren önemli hastalıkları sorunuz.\n* Geçirdiği cerrahi girişimleri, varsa ortaya çıkan komplikasyonları sorunuz.\n* Geçirdiği yaralanmalar ve kazaları sorunuz.\n* Alerjisi olup olmadığını sorunuz.\n* İlaç alerjisi\n* Gıda alerjisi\n* Saman nezlesi\n* Ekzema\n* Kurdeşen\n* Astma\n* Ürtiker\n* Serum hastalığı\n* Şimdiye kadar hangi aşıları olduğunu sorunuz.\n* Hasta kadın ise doğurganlık öyküsünü alınız ve kaydediniz.\n* Alışkanlıklarını öğreniniz (süren veya bırakılmış).\n* Alkol, sigara\n* Çay, kahve\n* Madde ve uyuşturucu\n* Beslenme\n* Tırnak yeme\n* Toprak yeme\n* Uyku düzeni\n* Spor\n* Kullandığı ilaçları sorunuz (Doz, süre mutlaka belirtilmelidir).\n* Meslek öyküsünü öğreniniz.\n* Evlilik öyküsünü öğreniniz.\n* Sosyal çevresi ile ilişkisini öğreniniz.\n\n**4 Soy Geçmiş**\n\n* Anne, baba, kardeş ve çocuklarının sağ olup olmadığını ve sağlık durumlarını sorgulayınız.\n* Anne (sağ / ölü / nedeni)\n* Baba (sağ / ölü / nedeni)\n* Kardeşler (sağ / ölü / nedeni)\n* Çocuklar (sağ / ölü / nedeni)\n* Aile ve akrabalarda kalıtımsal hastalıkların varlığını sorgulayınız.\n* Aile ve akrabalarda önemli hastalık olup olmadığını sorgulayınız.\n* Malign (kötü huylu) hastalık\n* Romatizma\n* Diyabet\n* Kalp hastalığı\n* Tiroid hastalığı\n* Hipertansiyon\n* Hepatit virüsü taşıyıcılığı\n* Tüberküloz, sıtma vb.\n* Kan hastalığı\n* Kanama eğilimi\n* Migren, sinir ve akıl hastalığı (ör: epilepsi, şizofreni)\n* Aile ve akrabalarda hastanın yakınmalarına benzer yakınmaları olan bireyler olup olmadığını sorunuz.\n\n**5 Sistemlerin Gözden Geçirilmesi**\n\n**Deri ile İlgili Sorular**\n\n* Deride kaşıntı, yanma, batma, ağrı şeklinde şikayetleriniz var mı?\n* Deride kızarıklık var mı?\n* Deride kabarıklık var mı?\n* Deride kepeklenme var mı?\n* Deride yara var mı?\n* Deri renginde koyulaşma ya da azalma gösteren alanlar var mı?\n* Saçlarınızda sorun var mı?\n* Tırnaklarınızda sorun var mı?\n* Ağızda sorun var mı?\n* Genital bölgenizde sorun var mı?\n\n**Baş ile İlgili Sorular**\n\n* Baş ağrısı var mı?\n* Baş dönmesi var mı?\n\n**Göz ile İlgili Sorular**\n\n* Gözde ağrı var mı?\n* Göz hareketleriyle göz dibinde ağrı oluyor mu?\n* Kızarıklık, kaşıntı, sulanma, çapaklanma var mı?\n* Işıktan rahatsız oluyor mu?\n* Görmesi nasıl?\n* Gözlük kullanıyor mu?\n* Çift görmesi var mı?\n* Glokom geçirmiş mi?\n* Kataraktı var mı?\n\n**Kulaklar ile İlgili Sorular**\n\n* Kulak ağrısı var mı?\n* Kulak akıntısı olmuş mu?\n* İşitmesinde azalma var mı?\n* Çınlama veya uğultu var mı?\n* Kulak enfeksiyonu geçirmiş mi?\n\n**Burun ve Sinüsler ile İlgili Sorular**\n\n* Burun kanaması var mı?\n* Burun tıkanıklığı var mı?\n* Geniz akıntısı var mı?\n* Sık nezle veya grip oluyor mu?\n\n**Ağız Boşluğu ile İlgili Sorular**\n\n* Diş ağrısı oluyor mu?\n* Dişlerin sağlık durumu nasıl?\n* Dudaklarında sorun oluyor mu?\n* Damaklarında sorun oluyor mu?\n* Ağızdan kanama var mı?\n* Ağızda acılık hissi var mı?\n* Tat alma sorunu var mı?\n* Sık bademcik iltihabı (tonsillit) geçiriyor mu?\n* Ses kısıklığı oluyor mu?\n\n**Boyun ile İlgili Sorular**\n\n* Boyunda ağrı var mı?\n* Boyun hareketlerinde sınırlama oluyor mu?\n* Boyunda eline gelen bir kitle var mı?\n* Boyunda beze var mı?\n\n**Solunum Sistemi ile İlgili Sorular**\n\n* Öksürük var mı?\n* Balgam çıkarıp çıkarmadığı, çıkarıyor ise niteliği nasıl?\n* Hemoptizi var mı?\n* Göğüs ağrısı var mı?\n* Soluk darlığı var mı?\n* Siyanoz var mı?\n* Tüberküloz, pnömoni, astım öyküsü var mı?\n* Son akciğer grafisi ne zaman çekilmiş?\n\n**Dolaşım Sistemi ile İlgili Sorular**\n\n* Hareketle soluk darlığı var mı?\n* Ortopne var mı?\n* Paroksismal noktürnal dispne var mı?\n* Angina pektoris var mı?\n* Çarpıntı var mı?\n* Claudicatio intermittans oluyor mu?\n* Kan basıncı yüksekliği öyküsü var mı?\n* Senkop var mı?\n* Ödem var mı?\n* Varis var mı?\n\n**Sindirim Sistemi ile İlgili Sorular**\n\n* İştahınız nasıl?\n* Yutma güçlüğü var mı?\n* Retrosternal yanma var mı?\n* Bulantı, kusma var mı?\n* Karın ağrısı var mı?\n* Aşırı gaz oluyor mu?\n* Hematemez oluyor mu?\n* Melena oluyor mu?\n* Dışkılama alışkanlığınız nasıl?\n* Dışkının özellikleri nasıl? Son zamanlarda bağırsak alışkanlığında değişiklik oldu mu?\n* Hematokezya oluyor mu?\n* Dışkıda parazit görüyor musunuz?\n* Sarılık geçirdiniz mi?\n\n**Kas İskelet Sistemi ile İlgili Sorular**\n\n* Boynunuzda ağrı var mı?\n* Belinizde ağrı var mı?\n* Sırtınızda ağrı var mı?\n* Kollarınızda ağrı var mı?\n* Bacaklarınızda ağrı var mı?\n* Eklemlerde ağrı var mı?\n* Sabah tutukluğu var mı?\n* Eklemlerde şişlik oluyor mu?\n* Eklemlerde kızarıklık var mı?\n* Eklemlerde sıcaklık artışı var mı?\n* Kollarda, bacaklarda ve gövdede şekil bozukluğu var mı?\n* Kaslarda incelme var mı?\n* Kaslarda kuvvet kaybı var mı?\n* Hareket kısıtlılığı var mı?\n* Hareket etme güçlüğü var mı?\n* Yürüme bozukluğu var mı?\n\n**Sinir Sistemi ile İlgili Sorular**\n\n* Bilinç kaybı veya değişikliği oluyor mu?\n* Baş dönmesi oluyor mu?\n* Baş ağrısı oluyor mu?\n* Görme bozukluğu oluyor mu?\n* Titreme (tremor) oluyor mu?\n* Kuvvet kaybı var mı?\n* Duyu kaybı (uyuşma) oluyor mu?\n* Ayakta dururken veya yürürken dengesizlik oluyor mu?\n* Yürüyüş bozukluğu var mı?\n* Konuşma bozukluğu oluyor mu?\n* Unutkanlık var mı?\n* Sara krizi (epilepsi nöbeti) oluyor mu?\n* Kafa travması geçirdiniz mi?\n* Felç geçirdiniz mi?\n\n**Üriner Sistemle İlgili Sorular**\n\n* Günde kaç kez idrara çıkıyorsunuz?\n* Günde ne kadar sıvı tüketiyorsunuz?\n* Günlük idrar miktarınız ne kadar?\n* Gece idrar yapmak için kalkıyor musunuz? Kaç defa?\n* İdrar yaparken ağrı, yanma oluyor mu?\n* İdrarda renk değişikliği var mı?\n* İdrarda kanama oluyor mu?\n* Ateşiniz var mı?\n* İdrar kaçırma var mı?\n* Yan ağrınız var mı? Varsa şiddeti?\n* Daha önceden taş düşürdünüz mü?\n* İdrar atımında, kuvvetinde zayıflama var mı?\n* İdrar yapmaya başlamada güçlük var mı?\n* Kesik kesik idrar yapma var mı?\n* Ani idrara çıkma hissi oluyor mu?\n* Üretral akıntı var mı?\n\n**Kadında Üreme Sistemi ile İlgili Sorular**\n\n* Menarş (ilk adet) zamanı?\n* Adet düzeni nasıl?\n* Son adet tarihi ne?\n* Dismenore var mı?\n* Gebeliklerin sayısı?\n* Düşüklerin sayısı ve zamanları\n* İstemli düşüklerinin (D\u0026C - Küretaj) sayısı\n* Doğum sayısı ve şekli\n* Genital bölgede ağrı oluyor mu?\n* Vajinal kanama, akıntı ve kaşınma var mı?\n* Eline gelen sarkıklık, kitle var mı?\n* Büyük abdest yaparken ağrı, zorlama var mı?\n* Memeleri ile ilgili bir sorun var mı?\n* Cinsel yolla bulaşan hastalık geçirmiş mi?\n* Genital bölgede yara var mı?\n* Libidosu nasıl?\n* Cinsel ilişki sırasında ağrı, yanma var mı?\n* Cinsel ilişkiden sonra leke şeklinde kanama var mı?\n* Cinsel ilişki sonrası koku rahatsız edici mi?\n\n**Erkekte Üreme Sistemi ile İlgili Sorular**\n\n* Cinsel isteksizlik var mı?\n* Sertleşme sorunu var mı?\n\n**6 Kapanış**\n\n* Hastadan aldığınız bilgileri özetleyiniz, hastalığı ile ilgili değerlendirme yapmasını isteyiniz ve ekleyeceği bir şey olup olmadığını sorunuz."},
  {id:"psikiyatrik",title:"Psikiyatrik Anamnez ve Muayene Klinik Becerisi",cat:"iletisim",content:"**Psikiyatrik Anamnez**\n\n1. Hastayı uygun biçimde karşılayınız.\n2. Hastayla işbirliği ve güvene dayalı bir ilişki kurmaya çalışınız. \n   * *Hastanın kendini güvende hissedeceği bir hasta-hekim ilişkisi kurmak, bazen hastalığa özgü nedenlerden ötürü güç olabilir. Örneğin, paranoid bir hasta hekime öfke ile karşılık verebilir. İyi anamnez alabilmenin bir koşulu, hem hastayla olumlu bir ilişkiyi hem de yansız gözlemi sürdürebilmektir*.\n3. Yansız, yüksüz, yargısız sorular sorarak asıl şikayetin ya da getirilme nedeninin ayrıntısını öğrenmeye çalışınız.\n4. Önemli bulduğu ek belirtilere / şikayetlere odaklanarak bunlar hakkında ayrıntılı sorular sorunuz. \n   * *Psikiyatride bazı hastaların asıl şikâyeti, tanısı ve tedavisi gereken sorunla birebir örtüşmeyebilir, ya da hasta sorununun bir hastalığa bağlı olmadığını düşünebilir. Bu durum, özellikle, gerçeği değerlendirme becerisinin bozulduğu hastalıklarda ortaya çıkar. Bu durumda hekimin dikkat etmesi gereken iki önemli husus vardır: (1) Eşlik eden kişilerden (aile, öğretmen, polis vb.) anamnez almak, (2) Hem hastanın asıl şikâyetini dikkate almak, hem de kendi ek sorularını sorabilmek*.\n5. Anlaşılmaz ya da müphem cevapları daha açık hale getirmek için mümkün olduğunca ısrarlı olunuz.\n6. Şikayetler ya da getirilme nedeni kronik ya da nüksler ve remisyonlarla seyreden bir hastalığı akla getiriyorsa, hastalığın önceki dönemine ilişkin anamnez alınız.\n   * *Örneğin ağır depresyon belirti ve bulguları olan bir hastanın daha önce depresyon ya da mani epizodu geçirip geçirmediğini anlamaya yönelik soru sormak gerekir*.\n7. Şikayetlerin ya da getirilme nedeninin akut ya da kronik bir stresörle (zorlayıcı yaşam olaylarıyla) ilişkili olup olmadığını değerlendiriniz. \n   * *Bazı hastalıklar zorlayıcı yaşam olaylarıyla daha yakından ilgilidir, ancak bütün hastalıklar böyle zorlanmalardan sonra başlayabilir ya da alevlenebilir. Belirtilerle zorlanmalar arasında bire bir nedensellik ilişkisi kurmak çoğu zaman zordur. Hasta belirtileri tamamen zorlanmalarla açıklayabilir ya da muhtemel bir zorlanmanın etkili olduğunu düşünmüyor olabilir. Hekimin, hem hastanın belirtileri atfettiği bir yaşam olayı olup olmadığını sorması, hem de kendi aldığı anamnezden, ilişkili olabilecek zorlanmaları saptaması gerekir*.\n8. İntihar düşünceleri olup olmadığını sorunuz.\n   * *“Kendinize zarar vermeyi, kendinizi öldürmeyi hiç düşündünüz mü? Şu anda böyle bir düşünceniz var mı?”*\n   * *“İnsanlar bazen çok sıkıntı, acı, elem yaşadığında ölümü kurtuluş yolu olarak görebiliyor. Hiç böyle düşündüğünüz oluyor mu?”*.\n9. Başkalarına zarar verme düşünceleri olup olmadığını sorunuz.\n   * *“Başkalarına öfkelendiğinizde onlara zarar verme isteği hissettiğiniz ya da buna niyetlendiğiniz oluyor mu?”*\n   * *“Daha önce hiç başkalarına zarar verdiğiniz oldu mu?”*.\n10. Özgeçmişini öğrenip not ediniz.\n11. Soygeçmişini öğrenip not ediniz.\n12. Hastaya görüşmenin sonunda size soru sorma fırsatı veriniz.\n13. Yakınlardan da anamnez almanız gerektiğini hatırlayınız.\n14. Görüşmede hem kapalı hem de açık uçlu sorulara yer veriniz.\n15. Nötr (yüksüz) ve ilgili tutumunuzu görüşme boyunca sürdürünüz.\n\n**Psikiyatrik Muayene**\n\n16. Genel görünüm ve dışavuran davranışı değerlendiriniz ve tarif ediniz.\n    * *Hasta yaşında mı gösteriyor?*\n    * *Görünür fiziksel kusuru var mı?*\n    * *Giyim kuşamı ve kendine bakımı sosyokültürel özellikleriyle uyumlu mu?*\n    * *Doktorla kurduğu ilişkide nasıl davranıyor? (Negativist, işbirliğine yatkın, tedirgin, rahat vb.)*.\n17. Bilinci ve yönelimi değerlendiriniz.\n18. Dikkati sürdürme kapasitesini değerlendiriniz.\n    * *Hastanın eğitim düzeyine ve klinik durumuna uygun olarak, çevresine dikkatle bakmasını isteyip gördüğü nesneler hakkında sorular sormak ya da yüzden geri üçer üçer ya da yedişer yedişer saydırmak ya da 5-6 harflik bir kelimenin harflerini tersten söyletmek*\n    * *Hıza değil doğruluğa bakmak*.\n19. Yakın belleği değerlendiriniz.\n    * *Hastanın eğitim düzeyine ve klinik durumuna uygun olarak,üç kelime söyleyip aklında tutmasını istemek ve bir süre sonra bunları tekrar söyletmek ya da daha uzun bir bilgi için aynı şeyi yapmak (örneğin tam bir adres)*.\n20. Uzak belleği değerlendiriniz.\n    * *İyi öğrenilmiş, unutulması zor bilgileri sormak (çocuklarının yaşları, doğum tarihi vb.)*.\n21. Algılamayı değerlendiriniz.\n    * *Halüsinasyonların varlığına işaret eden bulguları farkedip bunlara işaret etmek ve sormak (kendi kendine konuşma, mırıldanma, çevreye bir nesne görür gibi bakınma vb.)*\n    * *Diğer sorular: “Başkalarının işitmediği sesler işittiğiniz, görmediği şeyler gördüğünüz olur mu?”*\n    * *“Vücudunuz, vücudunuzun bir bölümü, çevredeki kişiler, nesneler değişiyormuş, gerçek değilmiş, tanıdık değilmiş gibi hissettiğiniz olur mu?”*.\n22. Zekayı değerlendiriniz.\n    * *Psikomotor gelişimde gecikme olmuş mu (yürüme, konuşma)*\n    * *Okul başarısı düşük müymüş? (okumayı geç öğrenme, ilk ya da orta okulda sınıfta kalma vb.)*.\n23. Düşünce yapısını değerlendiriniz.\n    * *Gerçeği değerlendirme kusuru (gerçek olmadığı belli olan ya da yakınlarının doğrulamadığı inanışlar hakkında ayrıntılı sorular sormak)*\n    * *Düşünce yoksulluğu (sorulara kısa, ayrıntıdan yoksun cevaplar verme vb.)*\n    * *Muhakeme kusuru (gündelik sorunları çözme kapasitesinde yetersizlik)*\n    * *Soyut düşünce kusuru (atasözleri gibi mecaz içeren sözlerin anlaşılmasında kusur)*.\n24. Düşünce akışını değerlendiriniz.\n    * *Hızlanma*\n    * *Yavaşlama*\n    * *Nitelikteki değişiklikler (çağrışımlarda gevşeme, perseverasyon vb.)*.\n25. Düşünce içeriğini değerlendiriniz.\n    * *Hastanın şikayeti, ek olarak söyledikleri hakkında yansız, yüksüz, yargısız sorular sormak*.\n26. Duygudurumu değerlendiriniz.\n    * *Konuşma içeriği, postür, mimikler, jestler, ses tonu gibi ipuçlarını değerlendirmek*\n    * *Hastaya kendisini nasıl hissettiğini açıkça sormak*\n    * *Bu ikisinden yola çıkarak hastanın duygudurumunun niteliğini belirtmek (anksiyeteli, tedirgin, neşeli, öfkeli vb.) ve patolojik bulgu varsa saptamak (öfori, disfori, şiddetli anksiyete vb.)*.\n27. Duygulanımı değerlendiriniz.\n    * *Sığlık, küntlük, düzleşme (mimikler ve jestlerin azlığı, ses tonunun tekdüzeliği vb. nedeniyle hastanın öznel duygudurumunun dışardan anlaşılmasında güçlük vb.)*.\n    * *Labilite (duygulanımın normalde beklenenden çok daha değişken olması, ağlarken gülmeye ya da neşeden öfkeye hızla geçmek vb.)*.\n    * *Uygunsuzluk (sosyal koşullarla, örneğin konuşma içeriğiyle uygunsuz duygulanım, kötü bir habere kahkaha atarak karşılık verme vb., ya da çoğu kişi tarafından tuhaf karşılanacak herhangi bir duygulanımın sergilenmesi, yetişkin bir hastanın çocuk gibi konuşması vb.)*.\n28. Psikomotor aktiviteyi değerlendiriniz.\n    * *Hızlanma (eksitasyon ya da ajitasyon, ya da daha hafif hızlanmalar)*\n    * *Yavaşlama (retardasyon ya da daha hafif yavaşlamalar)*\n    * *İstemsiz hareketler*.\n29. Genel değerlendirme ve formülasyon yapınız.\n    * *Anamnez ve muayene verilerinden yola çıkarak, şimdiki başvuruyu ve genel olarak psikiyatrik hastalığın ortaya çıkışını tıbbi ve çevresel etmenlerle ilişkili olarak (biyopsikososyal modele uygun biçimde) formüle ediniz*."},
  {id:"norolojik-muayene",title:"Nörolojik Muayene Becerisi",cat:"muayene",content:"**NÖROLOJİK MUAYENE BECERİSİ ÖĞRENİM REHBERİ**\n\n**KONUŞMA VE LİSAN MUAYENESİ BECERİ BASAMAKLARI**\n1. Hastaya kendinizi tanıtınız\n2. Hastanın adını ve yaşını sorunuz\n3. Hastadan şikayetlerini anlatmasını isteyerek spontan konuşmasını değerlendiriniz\n4. Hastaya hiçbir ipucu vermeden ve ne yapmasını istediğinizi göstermeden “......... Hanım/Bey, gözlerini kapat” deyiniz (benzer başka komut da verebilirsiniz)\n5. Hastaya kollarını işaret etmeden ve dokunmadan, sadece yüzüne bakarak “......... Hanım/Bey, kolunu kaldır” deyiniz (benzer başka komut da verebilirsiniz)\n6. Hasta 4 ve 5 nolu beceri basamaklarını başarıyla yerine getirmişse, “......... Hanım/Bey, kulağını tut ve ağzını aç” deyiniz (benzer başka komutlar da verebilirsiniz)\n7. Tek kelimeyle başlayarak ve hastanın başarılı olamadığı noktaya dek sırasıyla kelime sayısını arttırarak “kitap”, “kırmızı bayrak”, “yeşil kapılı ev”, “bu gün hava güzel” ibarelerini hastaya tekrar ettiriniz (başka kelimelerde kullanılabilir)\n8. Hastaya saatinizi gösterin ve “Bu ne?” diye sorunuz\n9. Hastaya kaleminizi gösterin ve “Bu ne?” diye sorunuz\n\n**GÖZ HAREKETLERİ MUAYENESİ BECERİ BASAMAKLARI**\n1. Hastayı muayene masasına oturtunuz\n2. Hastanın başını sabitleyiniz\n3. Sağ elinizle bir kalemi hastanın burnu hizasında ve hastadan 30-40 cm uzakta dik pozisyonda tutunuz\n4. Hastaya kalemin hareketini takip etmesini, çift görme olursa söylemesini isteyiniz\n5. Kalemi sağa doğru hareket ettirip, göz kürelerinin hareketini eksenin sonuna kadar yapıp yapmadığını gözleyiniz\n6. Bu sırada nistagmus olup olmadığını gözleyiniz\n7. Kalemi orta hatta getirip 4-6 nolu beceri basamaklarını sola doğru yapınız\n8. Kalemi orta hatta getirip yatay pozisyonda tutunuz\n9. 4-6 nolu beceri basamaklarını yukarı doğru yapınız\n10. Kalemi orta hatta getirip 4-6 nolu beceri basamaklarını aşağı doğru yapınız. Bu sırada hastanın göz kapaklarını kaldırınız\n11. 4-6 nolu beceri basamaklarını sağ yukarı oblik yönde tekrarlayınız\n11. 4-6 nolu beceri basamaklarını sol yukarı oblik yönde tekrarlayınız *(Kaynak metinde iki adet 11. basamak bulunmaktadır)*\n12. 4-6 nolu beceri basamaklarını sağ alt oblik yönde tekrarlayınız. Bu sırada hastanın göz kapaklarını kaldırınız\n13. 4-6 nolu beceri basamaklarını sol alt oblik yönde tekrarlayınız. Bu sırada hastanın göz kapaklarını kaldırınız\n\n**MİMİK KASLARIN MUAYENESİ BECERİ BASAMAKLARI**\n1. Hastayı muayene masasına oturtunuz\n2. Hastanın alın çizgilerini ve ağız kenarını gözleyiniz (asimetri var mı?)\n3. Hastadan gözlerini sıkıca yummasını isteyiniz\n4. Her iki gözün kapanmasında asimetri olup olmadığını gözleyiniz\n5. Hasta gözlerini sıkıca yumarken göz kapaklarını açmaya çalışınız\n6. Bu sırada asimetri olup olmadığını gözleyiniz\n7. Hastadan kaşlarını kaldırmasını isteyiniz\n8. Kaşlarını kaldırmada asimetri olup olmadığını gözleyiniz\n9. Hasta kaşlarını kaldırırken, siz ters yönde kuvvet uygulayarak, kaşlarını aşağıya indirmeye çalışınız\n10. Bu sırada asimetri olup olmadığını gözleyiniz\n11. Hastadan dişlerini göstermesini (güler gibi yapmasını) isteyiniz\n12. Bu sırada ağız köşelerinin yanlara doğru simetrik çekilip çekilmediğini gözleyiniz\n13. Hastaya yanaklarını balon gibi şişirmesini isteyiniz\n14. Hasta bunu yapabiliyorsa, parmaklarınızla yanaklara bastırıp kuvvet farkı olup olmadığını değerlendiriniz\n15. Hastadan ıslık çalar gibi yapmasını isteyiniz\n16. Sağ ve sol tarafta kuvvet farkı olup olmadığını değerlendiriniz\n17. Bulgularınızı not ediniz\n\n**ALT KRANYAL SİNİRLERİN (9-10-11-12) MUAYENESİ BECERİ BASAMAKLARI**\n1. Hastayı muayene masasına oturtunuz ve karşısına geçiniz.\n2. Hastaya uzun cevaplar verebileceği sorular sorarak konuşmasının karakterini muayene ediniz (artikülasyon, fonasyon normal mi?)\n3. Ağzını açtırarak uvulanın duruşuna, palatal arkların yüksekliğine ve simetrisine bakınız.\n4. Bu sırada hastaya ‘aaaa’ dedirtiniz. Hasta ses çıkarırken palatal arkların yü
